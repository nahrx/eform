# ============================================================
# eForm BPS Kalimantan Timur — Docker Compose
# ============================================================
# Usage:
#   1. Copy .env.example to .env and adjust the values.
#   2. docker compose up -d
#
# Automatic startup order:
#   db  ->  app (migrations + superadmin seed)  ->  seeder (region data)
#
# Requires Docker Compose v2 (command: docker compose).
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eform}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-eform} -d ${POSTGRES_DB:-eform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eform_net

  # ----------------------------------------------------------
  # Main application
  # Schema migrations and the superadmin seed run automatically at startup.
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eform-backend:latest # named so the seeder service can reuse it
    container_name: eform_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eform}
      POSTGRES_SSLMODE: disable

      # JWT — MUST be replaced in production (a long random string)
      JWT_SECRET: ${JWT_SECRET:-REPLACE_IN_PRODUCTION_WITH_A_LONG_RANDOM_STRING}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}

      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      WEB_DIR: /app/web
      PUBLIC_DIR: /app/public

      # Organisation identity shown on the pages
      ORGANISATION_NAME: ${ORGANISATION_NAME:-BPS Provinsi Kalimantan Timur}
      ORGANISATION_NICKNAME: ${ORGANISATION_NICKNAME:-BPS Kaltim}

      # Initial superadmin (created only while the users table is empty)
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@bps.go.id}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin12345}

      # Google OAuth (optional — leave empty if unused)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    volumes:
      - uploads_data:/app/public/uploads
    ports:
      - "${APP_PORT:-8789}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - eform_net

  # ----------------------------------------------------------
  # Seeder for the Indonesian region data (wilayah).
  # Runs once, after the app is healthy and migrations have finished.
  # Idempotent: safe to run again, it does not duplicate rows.
  # ----------------------------------------------------------
  seeder:
    image: eform-backend:latest # reuse the same image, no rebuild
    container_name: eform_seeder
    restart: "no" # once is enough; restart by hand if needed
    depends_on:
      app:
        condition: service_healthy
    command: ["./eform-seeder", "-file", "./data/wilayah_indonesia.csv"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eform}
      POSTGRES_SSLMODE: disable
    networks:
      - eform_net

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  eform_net:
    driver: bridge
