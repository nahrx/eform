<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responses · eForm</title>
<style>
:root{
  --ink:#13171e;--ink-soft:#4a525e;--muted:#79828f;
  --surface:#eef1f5;--panel:#fff;--panel-2:#f7f9fb;
  --line:#dfe4ea;--line-2:#eef1f5;
  --accent:#0e7490;--accent-ink:#0b5563;--accent-soft:#d6edf1;
  --ok:#15803d;--ok-soft:#dcfce7;
  --warn-soft:#fef9c3;--warn-ink:#854d0e;
  --radius:10px;--radius-s:7px;
  --shadow:0 1px 2px rgba(19,23,30,.06),0 8px 24px -16px rgba(19,23,30,.25);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

.shell{display:flex;flex-direction:column;height:100vh}

/* topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.form-title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px}
.count-badge{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:var(--radius-s);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#c6cdd6;background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-sm{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 9px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-sm:hover:not([disabled]){background:var(--panel-2)}
.btn-sm[disabled]{opacity:.4;cursor:default}

/* filter bar */
.filter-sel{font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);color:var(--ink);max-width:170px}
.filter-sel:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.filter-search{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);color:var(--ink);width:170px}
.filter-search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.filter-search::placeholder{color:var(--muted)}
.filter-sep{width:1px;height:20px;background:var(--line);flex:none;align-self:center}
.filter-chip{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.btn-reset{border:none;background:none;color:var(--muted);padding:3px 6px;border-radius:var(--radius-s);font-size:12px;cursor:pointer}
.btn-reset:hover{background:var(--line-2);color:var(--ink)}

/* field filter section (superadmin only) */
.ff-bar{display:flex;align-items:center;gap:8px;padding:7px 20px;background:#f0f7f9;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ff-bar:empty{display:none}
.ff-group{display:flex;align-items:center;gap:5px}
.ff-lbl{font-size:11px;color:var(--accent-ink);font-weight:600;white-space:nowrap;background:var(--accent-soft);padding:2px 7px;border-radius:4px}
.ff-input{font-size:12.5px;padding:4px 9px;border:1px solid var(--accent-soft);border-radius:var(--radius-s);background:var(--panel);color:var(--ink);width:150px}
.ff-input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.ff-input::placeholder{color:var(--muted)}

/* tabel area */
.tbl-outer{flex:1;overflow:auto;padding:18px 20px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.resp-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.resp-tbl th{background:var(--panel-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.resp-tbl th.sortable{cursor:pointer;user-select:none}
.resp-tbl th.sortable:hover{color:var(--ink-soft)}
.resp-tbl th.sort-active{color:var(--accent-ink)}
.sort-ic{margin-left:3px;font-size:10px;opacity:.35}
.resp-tbl th.sort-active .sort-ic{opacity:1}
.resp-tbl td{padding:9px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.resp-tbl tbody tr:last-child td{border-bottom:none}
.resp-tbl tbody tr:hover td{background:var(--panel-2)}
.resp-tbl .td-num{font-family:var(--mono);font-size:12px;color:var(--muted);width:48px}
.resp-tbl .td-status{width:100px}
.resp-tbl .td-share{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.resp-tbl .td-who{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resp-tbl .td-time{white-space:nowrap;font-size:12px;color:var(--muted)}
.resp-tbl .td-val{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ink-soft)}
.resp-tbl .td-act{width:70px;text-align:right}

/* badge status */
.st-badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700}
.st-submitted{background:var(--ok-soft);color:var(--ok)}
.st-draft{background:var(--warn-soft);color:var(--warn-ink)}

/* bottom pager */
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel-2)}

/* column picker */
.col-wrap{position:relative}
.col-panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);width:280px;z-index:100;display:none}
.col-panel.open{display:block}
.col-panel-h{padding:10px 13px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
.col-list{padding:8px 13px;max-height:220px;overflow-y:auto}
.col-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer;user-select:none}
.col-item input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:14px;height:14px}
.col-item label{cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-panel-foot{padding:8px 13px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px}
.col-hint{padding:4px 0 2px;font-size:11px;color:var(--muted)}

.loading,.empty-state{padding:32px;text-align:center;color:var(--muted);font-size:13px}
</style>
<link rel="stylesheet" href="/responses.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="btn" href="/admin">← Admin</a>
    <span class="form-title" id="formTitle">Loading…</span>
    <span class="count-badge" id="countBadge" hidden></span>
    <div class="col-wrap" id="colWrap" hidden>
      <button class="btn" id="btnKolom">Columns ▾</button>
      <div class="col-panel" id="colPanel">
        <div class="col-panel-h">Choose extra columns <span style="font-weight:400">(maks 5)</span></div>
        <div class="col-list" id="colList"></div>
        <div class="col-panel-foot">
          <button class="btn-sm" id="btnColReset">Reset</button>
          <button class="btn primary btn-sm" id="btnColApply">Terapkan</button>
        </div>
      </div>
    </div>
    <button class="btn" id="btnFilter">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="3" y1="6" x2="17" y2="6"/><line x1="6" y1="10" x2="14" y2="10"/><line x1="9" y1="14" x2="11" y2="14"/></svg>
      Filter<span class="filter-count" id="filterCount" hidden></span>
    </button>
    <div class="export-wrap" id="exportWrap" hidden>
      <button class="btn primary" id="btnExport" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9"/><polyline points="6.5,8.5 10,12 13.5,8.5"/><path d="M4 15h12"/></svg>
        Ekspor<span class="export-caret">▾</span>
      </button>
      <div class="export-menu" id="exportMenu" hidden>
        <button type="button" class="export-item" data-ext="xlsx">Excel<span class="export-ext">xlsx</span></button>
        <button type="button" class="export-item" data-ext="csv">CSV<span class="export-ext">csv</span></button>
      </div>
    </div>
  </header>

  <!-- Active filter summary; hidden until a filter is applied -->
  <div class="active-bar" id="activeBar" hidden>
    <div class="active-chips" id="filterChips"></div>
    <button class="btn-reset" id="btnReset" onclick="resetFilters()">✕ Reset all</button>
  </div>

  <div class="tbl-outer">
    <div class="tbl-wrap" id="tblWrap">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<!-- Filter drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="filter-drawer" id="filterDrawer" aria-hidden="true" aria-label="Filter responses">
  <div class="drawer-h">
    <span>Filter</span>
    <button class="drawer-close" id="btnDrawerClose" aria-label="Close filter">✕</button>
  </div>
  <div class="drawer-b">
    <div class="drawer-sect">
      <label class="drawer-lbl" for="fSearch">Search</label>
      <input class="filter-search" id="fSearch" placeholder="Search name / email…" oninput="onSearchDebounce()">
    </div>
    <div class="drawer-sect">
      <label class="drawer-lbl" for="fStatus">Status</label>
      <select class="filter-sel" id="fStatus" onchange="onFilter()">
        <option value="">All</option>
        <option value="submitted">Submitted</option>
        <option value="draft">Draft</option>
      </select>
    </div>
    <div class="drawer-sect">
      <label class="drawer-lbl" for="fShare">Share</label>
      <select class="filter-sel" id="fShare" onchange="onFilter()">
        <option value="">All</option>
      </select>
    </div>
    <!-- Per-field filters (superadmin/admin only, shown once columns are selected) -->
    <div class="ff-bar" id="ffBar"></div>
  </div>
  <div class="drawer-f">
    <button class="btn" onclick="resetFilters()">Reset</button>
    <button class="btn primary" id="btnDrawerDone">Done</button>
  </div>
</aside>
<script src="/searchable-select.js"></script>
<script src="/responsive-tables.js"></script>
<script src="/responses-ui.js"></script>
<script src="/responses-core.js"></script>
<script>
const TOKEN=localStorage.getItem("eform_token");
if(!TOKEN)location.replace("/login");
const FORM_ID=new URLSearchParams(location.search).get("id");
if(!FORM_ID)location.replace("/admin");

const H={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};

let SCHEMA=null, RESPONSES=[], TOTAL=0, PAGE=0, MY_ROLE="admin";

// Hook for responses-core.js: only admin/superadmin may filter per field on this
// page. It is a function rather than a constant because MY_ROLE is only known
// populated once /api/auth/me has finished.
function canFieldFilter(){ return MY_ROLE==="superadmin"||MY_ROLE==="admin"; }

const PAGE_SIZE=50;
const COL_KEY="eform_cols_"+FORM_ID;
let SEL_COLS=[], ALL_FIELDS=[], SHARE_MAP={};

// state filter & sort
let SORT_BY="waktu", SORT_DIR="desc";
let FILTER_STATUS="", FILTER_SHARE="", FILTER_SEARCH="";
let FIELD_FILTERS={};       // fieldName → text value (ILIKE)
let FIELD_EXACT_FILTERS={}; // fieldName → exact value (=, for dropdown/radio/date)
let FIELD_ANY_FILTERS={};   // fieldName → list of values (any of them, for checkbox/multiselect)
let FIELD_RANGE_FILTERS={}; // fieldName → {min,max} (numeric range)
const NUMER_TYPES=new Set(["number","integer","decimal","currency","range","rating"]);
let _searchTimer=null, _fieldTimer=null;

async function api(path,opts){
  opts=opts||{};
  const r=await fetch(path,{...opts,headers:{...H,...(opts.headers||{})}});
  if(r.status===401){localStorage.removeItem("eform_token");location.replace("/login");throw new Error("session expired");}
  const ct=r.headers.get("content-type")||"";
  const data=ct.includes("json")?await r.json():null;
  if(!r.ok)throw new Error((data&&data.error)||("HTTP "+r.status));
  return data;
}

async function init(){
  try{
    const me=await api("/api/auth/me").catch(()=>({role:"admin"}));
    MY_ROLE=me.role||"admin";

    const [form,sharesData]=await Promise.all([
      api("/api/forms/"+FORM_ID),
      api("/api/forms/"+FORM_ID+"/shares").catch(()=>({shares:[]}))
    ]);
    (sharesData.shares||[]).forEach(sh=>{
      SHARE_MAP[sh.id]=sh.label||(sh.token?"["+sh.token.slice(0,6)+"]":"—");
    });
    SCHEMA=form.schema;
    document.title="Responses · "+(form.title||"Form");
    document.getElementById("formTitle").textContent=form.title||"Form";
    // The Export button only appears once the form has loaded; its menu
    // pilihan formatnya diurus responses-ui.js.
    document.getElementById("exportWrap").hidden=false;

    ALL_FIELDS=extractFields(SCHEMA);
    // Column preference: from the server (column_config) when present, falling back to localStorage
    const serverCols=form.columnConfig&&Array.isArray(form.columnConfig)&&form.columnConfig.length
      ?form.columnConfig:null;
    SEL_COLS=serverCols||loadColPref();
    // Auto-sync: if the server has none but localStorage does, push it to the server straight away
    if(!serverCols&&SEL_COLS.length)saveColsToServer(SEL_COLS);

    if((MY_ROLE==="superadmin"||MY_ROLE==="admin")&&ALL_FIELDS.length){
      document.getElementById("colWrap").hidden=false;
      buildColPicker();
      renderFieldFilters();
    }
    buildShareFilter();
    await loadPage(0);
  }catch(e){
    document.getElementById("formTitle").textContent="Failed to load: "+e.message;
  }
}

/* ---- share filter dropdown ---- */
function buildShareFilter(){
  const sel=document.getElementById("fShare");
  Object.entries(SHARE_MAP).forEach(([id,label])=>{
    const opt=document.createElement("option");
    opt.value=id; opt.textContent=label;
    sel.appendChild(opt);
  });
}

/* ---- helpers for field options ---- */
function getOptions(c){
  const opts=[];
  if(c.optionsRef&&SCHEMA){
    const t=(SCHEMA.referenceData||{})[c.optionsRef];
    if(t&&t.items)t.items.forEach(it=>opts.push({value:String(it.code),label:txt(it.label)}));
  }
  if(!opts.length&&c.options)
    c.options.forEach(o=>opts.push({value:String(o.value),label:txt(o.label)||String(o.value)}));
  return opts;
}

// Decide the filter kind for one field, matching its original input type:
//  {kind:"select"/"multiselect", opts:[...]}         → static dropdown (single or multiple choice)
//  {kind:"api"/"multiapi", url, ...}                 → dropdown from an API (no dependencies)
//  {kind:"cascade"/"multicascade", urlTpl, deps, ...}→ API dropdown that depends on other fields
//  {kind:"date"/"datetime"/"time"}                   → native date/time input
//  {kind:"text"}                                     → free-text input (ILIKE)

// Cache API fetch results so they are not repeated

/* ---- field filter bar (superadmin) ---- */

function onFieldInput(el){
  const name=el.dataset.field;
  const val=el.value.trim();
  if(val)FIELD_FILTERS[name]=val; else delete FIELD_FILTERS[name];
  clearTimeout(_fieldTimer);
  _fieldTimer=setTimeout(()=>loadPage(0),350);
}

function onFieldRangeInput(el){
  const name=el.dataset.field,bound=el.dataset.bound;
  const cur=FIELD_RANGE_FILTERS[name]||{min:"",max:""};
  cur[bound]=el.value.trim();
  if(cur.min||cur.max)FIELD_RANGE_FILTERS[name]=cur; else delete FIELD_RANGE_FILTERS[name];
  clearTimeout(_fieldTimer);
  _fieldTimer=setTimeout(()=>loadPage(0),350);
}

function onFieldSelect(el){
  const name=el.dataset.field;
  const val=el.value;
  if(val)FIELD_EXACT_FILTERS[name]=val; else delete FIELD_EXACT_FILTERS[name];
  // Re-render if a cascade child depends on this field
  const hasCascadeChild=SEL_COLS.some(colName=>{
    if(colName===name)return false;
    const fk=fieldFilterKind(findField(SCHEMA,colName));
    return(fk.kind==="cascade"||fk.kind==="multicascade")&&fk.deps.includes(name);
  });
  if(hasCascadeChild)renderFieldFilters();
  loadPage(0);
}

function onFieldMultiSelect(el){
  const name=el.dataset.field;
  const vals=[...el.selectedOptions].map(o=>o.value).filter(Boolean);
  if(vals.length)FIELD_ANY_FILTERS[name]=vals; else delete FIELD_ANY_FILTERS[name];
  const hasCascadeChild=SEL_COLS.some(colName=>{
    if(colName===name)return false;
    const fk=fieldFilterKind(findField(SCHEMA,colName));
    return(fk.kind==="cascade"||fk.kind==="multicascade")&&fk.deps.includes(name);
  });
  if(hasCascadeChild)renderFieldFilters();
  // The checkbox dropdown stays open, so users typically tick several values in a
  // row — debounce the reload so it is not one request per tick.
  clearTimeout(_fieldTimer);
  _fieldTimer=setTimeout(()=>loadPage(0),350);
}

/* ---- filter events ---- */
function onFilter(){
  FILTER_STATUS=document.getElementById("fStatus").value;
  FILTER_SHARE=document.getElementById("fShare").value;
  loadPage(0);
}

function onSearchDebounce(){
  clearTimeout(_searchTimer);
  _searchTimer=setTimeout(()=>{
    FILTER_SEARCH=document.getElementById("fSearch").value.trim();
    loadPage(0);
  },350);
}

function resetFilters(){
  FILTER_STATUS="";FILTER_SHARE="";FILTER_SEARCH="";
  FIELD_FILTERS={};FIELD_EXACT_FILTERS={};FIELD_ANY_FILTERS={};FIELD_RANGE_FILTERS={};
  document.getElementById("fStatus").value="";
  document.getElementById("fShare").value="";
  document.getElementById("fSearch").value="";
  renderFieldFilters();
  loadPage(0);
}


/* ---- sort ---- */
function toggleSort(col){
  if(SORT_BY===col)SORT_DIR=SORT_DIR==="asc"?"desc":"asc";
  else{SORT_BY=col;SORT_DIR=col==="waktu"?"desc":"asc";}
  loadPage(0);
}

/* ---- load page (server-side) ---- */
async function loadPage(page){
  PAGE=page;
  document.getElementById("tblWrap").innerHTML='<div class="loading">Loading…</div>';
  try{
    const params=new URLSearchParams({limit:PAGE_SIZE,offset:PAGE*PAGE_SIZE,sortBy:SORT_BY,sortDir:SORT_DIR});
    if(FILTER_STATUS)params.set("status",FILTER_STATUS);
    if(FILTER_SHARE)params.set("shareId",FILTER_SHARE);
    if(FILTER_SEARCH)params.set("search",FILTER_SEARCH);
    Object.entries(FIELD_FILTERS).forEach(([k,v])=>{if(v)params.set("f_"+k,v);});
    Object.entries(FIELD_EXACT_FILTERS).forEach(([k,v])=>{if(v)params.set("fe_"+k,v);});
    Object.entries(FIELD_ANY_FILTERS).forEach(([k,v])=>{if(v&&v.length)params.set("fea_"+k,v.join(","));});
    Object.entries(FIELD_RANGE_FILTERS).forEach(([k,v])=>{
      if(v.min)params.set("fer_"+k+"_min",v.min);
      if(v.max)params.set("fer_"+k+"_max",v.max);
    });

    const data=await api("/api/forms/"+FORM_ID+"/responses?"+params);
    RESPONSES=data.responses||[];
    TOTAL=data.total||0;

    const isFiltered=FILTER_STATUS||FILTER_SHARE||FILTER_SEARCH||Object.keys(FIELD_FILTERS).length||Object.keys(FIELD_EXACT_FILTERS).length||Object.keys(FIELD_ANY_FILTERS).length||Object.keys(FIELD_RANGE_FILTERS).length;
    const badge=document.getElementById("countBadge");
    badge.textContent=TOTAL+" responses"+(isFiltered?" (filtered)":"");
    badge.hidden=false;
    updateFilterUI();
    renderTable();
  }catch(e){
    document.getElementById("tblWrap").innerHTML=`<div class="empty-state">${esc(e.message)}</div>`;
  }
}

/* ---- schema field extraction ---- */
function extractFields(schema){
  const out=[];
  function walk(comps,inRoster){
    for(const c of comps||[]){
      if(c.kind==="field"){
        if(!inRoster&&c.type!=="note"&&c.type!=="hidden"&&c.type!=="markdown"&&c.name)
          out.push({name:c.name,label:txt(c.label)||c.name});
      }else if(c.kind==="roster"){walk(c.components||[],true);}
      else if(c.components){walk(c.components,inRoster);}
    }
  }
  for(const p of schema?.pages||[])walk(p.components||[],false);
  return out;
}

function loadColPref(){
  try{const s=localStorage.getItem(COL_KEY);if(s){const a=JSON.parse(s);if(Array.isArray(a))return a.slice(0,5);}}catch{}
  return [];
}
function saveColPref(cols){try{localStorage.setItem(COL_KEY,JSON.stringify(cols));}catch{}}

/* ---- column picker ---- */
function buildColPicker(){
  const list=document.getElementById("colList");
  if(!ALL_FIELDS.length){list.innerHTML='<div class="col-hint">No fields available.</div>';return;}
  list.innerHTML=ALL_FIELDS.map(f=>`<label class="col-item">
    <input type="checkbox" value="${esc(f.name)}" ${SEL_COLS.includes(f.name)?"checked":""}>
    <span>${esc(f.label)}</span>
  </label>`).join("");
  list.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      if([...list.querySelectorAll("input:checked")].length>5)cb.checked=false;
    });
  });
}

document.getElementById("btnKolom")?.addEventListener("click",e=>{
  e.stopPropagation();document.getElementById("colPanel").classList.toggle("open");
});
document.addEventListener("click",()=>document.getElementById("colPanel")?.classList.remove("open"));
document.getElementById("colPanel")?.addEventListener("click",e=>e.stopPropagation());

function saveColsToServer(cols){
  api("/api/forms/"+FORM_ID+"/column-config",{method:"PUT",body:JSON.stringify({cols})}).catch(()=>{});
}

document.getElementById("btnColApply")?.addEventListener("click",()=>{
  const newCols=[...document.querySelectorAll("#colList input:checked")].map(cb=>cb.value).slice(0,5);
  // clear filters for fields whose column was removed
  SEL_COLS.filter(c=>!newCols.includes(c)).forEach(c=>{delete FIELD_FILTERS[c];delete FIELD_EXACT_FILTERS[c];delete FIELD_ANY_FILTERS[c];delete FIELD_RANGE_FILTERS[c];});
  SEL_COLS=newCols;
  saveColPref(SEL_COLS);
  saveColsToServer(SEL_COLS);
  document.getElementById("colPanel").classList.remove("open");
  renderFieldFilters();
  loadPage(0);
});
document.getElementById("btnColReset")?.addEventListener("click",()=>{
  SEL_COLS.forEach(c=>{delete FIELD_FILTERS[c];delete FIELD_EXACT_FILTERS[c];delete FIELD_ANY_FILTERS[c];delete FIELD_RANGE_FILTERS[c];});
  SEL_COLS=[];saveColPref([]);
  saveColsToServer([]);
  document.querySelectorAll("#colList input").forEach(cb=>cb.checked=false);
  document.getElementById("colPanel").classList.remove("open");
  renderFieldFilters();
  loadPage(0);
});

/* ---- render tabel ---- */
// responsive-tables.js uses data-label as the column label when the table turns into
// cards on phones — without it the sort icon (↕) would end up in the label.

function renderTable(){
  if(!RESPONSES.length){
    const msg=FILTER_STATUS||FILTER_SHARE||FILTER_SEARCH||Object.keys(FIELD_FILTERS).length||Object.keys(FIELD_EXACT_FILTERS).length
      ?"No responses match the filter.":"No responses yet.";
    document.getElementById("tblWrap").innerHTML=`<div class="empty-state">${msg}</div>`;
    return;
  }

  // Extra column headers — sortable for superadmin and admin
  const extraTh=SEL_COLS.map(name=>{
    const f=ALL_FIELDS.find(ff=>ff.name===name);
    const label=f?f.label:name;
    return(MY_ROLE==="superadmin"||MY_ROLE==="admin")
      ?sortTh(name,esc(label),"td-val")
      :`<th class="td-val" data-label="${esc(label)}">${esc(label)}</th>`;
  }).join("");

  let html=`<table class="resp-tbl cards"><thead><tr>
    <th class="td-num">#</th>
    ${sortTh("status","Status","td-status")}
    ${sortTh("share","Share","td-share")}
    ${sortTh("who","Respondent","td-who")}
    ${sortTh("waktu","Time","td-time")}
    ${extraTh}
    <th class="td-act">Aksi</th>
  </tr></thead><tbody>`;

  RESPONSES.forEach((resp,i)=>{
    const num=PAGE*PAGE_SIZE+i+1;
    const answers=parseAnswers(resp.answers);
    const meta=parseAnswers(resp.meta);
    const isDraft=resp.status==="draft";
    const badge=isDraft
      ?`<span class="st-badge st-draft">Draft</span>`
      :`<span class="st-badge st-submitted">Submitted</span>`;
    const who=meta.name
      ?`${esc(meta.name)}<br><span style="font-size:11px;color:var(--muted)">${esc(meta.email||"")}</span>`
      :esc(meta.email||"—");
    const time=formatDate(resp.submittedAt);
    const shareLabel=resp.shareId
      ?esc(SHARE_MAP[resp.shareId]||resp.shareId.slice(0,8)+"…")
      :`<span style="color:var(--muted)">—</span>`;
    const extraVals=SEL_COLS.map(name=>{
      const c=findField(SCHEMA,name);
      const val=c?formatFieldValue(c,answers[name],answers):valStr(answers[name]);
      // The card view on phones uses is-empty to skip empty columns, so a card is
      // not filled with labels that have no content.
      const empty=String(val??"").trim()===""?" is-empty":"";
      return`<td class="td-val${empty}" title="${esc(val)}">${esc(truncate(val,40))}</td>`;
    }).join("");
    html+=`<tr>
      <td class="td-num">${num}</td>
      <td class="td-status">${badge}</td>
      <td class="td-share" title="${resp.shareId?esc(SHARE_MAP[resp.shareId]||resp.shareId):""}">${shareLabel}</td>
      <td class="td-who">${who}</td>
      <td class="td-time">${time}</td>
      ${extraVals}
      <td class="td-act"><button class="btn-sm" onclick="openView('${esc(resp.id)}')">View</button></td>
    </tr>`;
  });

  html+=`</tbody></table>`;

  const totalPages=Math.ceil(TOTAL/PAGE_SIZE)||1;
  const pager=totalPages>1
    ?`<div class="tbl-foot">
        <button class="btn-sm" ${PAGE===0?"disabled":""} onclick="loadPage(${PAGE-1})">‹ Previous</button>
        <span>${PAGE+1} / ${totalPages} pages · ${TOTAL} responses</span>
        <button class="btn-sm" ${PAGE>=totalPages-1?"disabled":""} onclick="loadPage(${PAGE+1})">Berikutnya ›</button>
      </div>`
    :`<div class="tbl-foot"><span>${TOTAL} responses</span></div>`;

  document.getElementById("tblWrap").innerHTML=html+pager;
}

function openView(id){
  window.open("/response-view?form="+encodeURIComponent(FORM_ID)+"&resp="+encodeURIComponent(id),"_blank");
}

/* ---- helpers ---- */
// The CSV & Excel exports share one path; only the extension differs.
window.downloadExport = async function(ext){
  try{
    const r=await fetch("/api/forms/"+FORM_ID+"/responses."+ext,{headers:H});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||"Failed");}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="responses-"+FORM_ID+"."+ext;a.click();
    URL.revokeObjectURL(url);
  }catch(e){alert(e.message);}
};

init();
