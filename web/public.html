<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{
  --ink:#13171e;--ink-soft:#4a525e;--muted:#79828f;
  --surface:#eef1f5;--panel:#fff;--panel-2:#f7f9fb;
  --line:#dfe4ea;--line-2:#eef1f5;
  --accent:#0e7490;--accent-ink:#0b5563;--accent-soft:#d6edf1;
  --roster:#047857;
  --ok:#15803d;--ok-soft:#dcfce7;--bad:#b42318;--bad-soft:#fde7e4;--warn:#b45309;
  --radius:10px;--radius-s:7px;
  --shadow:0 1px 3px rgba(19,23,30,.07),0 4px 14px -6px rgba(19,23,30,.1);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}

/* ---- layout ---- */
.pv{display:flex;flex-direction:column;height:100vh}
.pv-bar{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.pv-title{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-brand{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;white-space:nowrap}
.pv-main{flex:1;display:flex;min-height:0}
.pv-side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 12px;transition:width .2s ease,padding .2s ease}
.pv-side.collapsed{width:0;padding:0;overflow:hidden;border-right-color:transparent}
.pv-side-h{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 10px}
.pv-side-tog{border:none;background:transparent;color:var(--ink-soft);padding:5px 8px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1;flex:none;transition:background .12s}
.pv-side-tog:hover{background:var(--panel-2);color:var(--ink)}
.pv-side-bd{display:none;position:fixed;inset:0;background:rgba(19,23,30,.35);z-index:59;cursor:pointer}
.pv-pg{padding:9px 10px;border-radius:var(--radius-s);cursor:pointer;font-size:12.5px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .1s}
.pv-pg:hover{background:var(--panel-2)}
.pv-pg.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.pv-subpg{display:flex;align-items:center;gap:7px;padding:7px 10px 7px 22px;border-radius:var(--radius-s);cursor:pointer;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-subpg:hover{background:var(--panel-2)}
.pv-subpg .pv-ri{color:#059669;flex:none}
.pv-subpg.active{background:#d8f3e5;color:#059669;font-weight:600}
.pv-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.pv-body{flex:1;overflow:auto;padding:28px 20px 36px}

/* ---- draft note ---- */
.pv-draft-note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;background:var(--accent-soft);border-bottom:1px solid #c3dfe5;font-size:12.5px;color:var(--accent-ink);flex:none}
.pv-draft-note button{border:none;background:transparent;color:var(--accent-ink);font-size:16px;line-height:1;cursor:pointer;padding:0 4px;opacity:.7}
.pv-draft-note button:hover{opacity:1}

/* ---- user bar ---- */
.pv-ubar{display:flex;align-items:center;gap:10px;max-width:660px;margin:0 auto 20px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow)}
.pv-uavatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft)}
.pv-uname{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-uemail{font-size:11.5px;color:var(--muted);flex:none}
.pv-ulogout{border:none;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:5px;transition:.1s}
.pv-ulogout:hover{background:var(--panel-2);color:var(--ink)}

/* ---- page content ---- */
.pv-page{max-width:660px;margin:0 auto 10px}
.pv-h2{font-size:21px;font-weight:700;margin:0 0 20px;line-height:1.3;color:var(--ink)}
.pv-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px}
.pv-bt{font-weight:700;font-size:15px;margin:0 0 16px;padding-bottom:11px;border-bottom:1px solid var(--line-2);color:var(--ink)}
.pv-sec{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:9px;padding:14px 16px;margin-bottom:16px;background:var(--panel-2)}
.pv-st{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px}
.pv-field{margin-bottom:18px}
.pv-lab{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;line-height:1.4;color:var(--ink)}
.pv-req{color:var(--bad)}
.pv-hint{font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.55}
.pv-unit{font-size:12px;color:var(--muted);margin-left:6px}
.pv-in{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;background:var(--panel);font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.pv-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pv-in:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;border-color:var(--line)}
.pv-vmsg{font-size:11.5px;margin-top:5px}
.pv-vmsg.error{color:var(--bad)}
.pv-vmsg.warning{color:var(--warn)}
.pv-vmsg.req{color:var(--muted)}
.pv-inbtn{display:flex;gap:8px;align-items:center}
.pv-inbtn .pv-in{flex:1}
.pv-smbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:var(--radius-s);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none;transition:.12s}
.pv-smbtn:hover:not(:disabled){border-color:#c6cdd6;background:var(--panel-2)}
.pv-smbtn:disabled{opacity:.5;cursor:not-allowed}
.pv-geomsg{font-size:11.5px;color:var(--muted);margin-top:5px}
.pv-geomsg.error{color:var(--bad)}
.pv-sigwrap{display:flex;flex-direction:column;gap:8px}
.pv-sigpad{width:100%;max-width:400px;height:140px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fafcff;touch-action:none;cursor:crosshair}
.pv-sigpad[data-disabled="1"]{cursor:not-allowed;opacity:.6}
.pv-sigactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pv-sigmsg{font-size:11.5px;color:var(--muted)}
.pv-sigmsg.pending{color:var(--warn)}
.pv-sigmsg.ok{color:var(--ok)}
.pv-sigmsg.error{color:var(--bad)}
.pv-photowrap{display:flex;flex-direction:column;gap:8px}
.pv-photorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pv-photolabel{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--radius-s);padding:10px 16px;font-size:13px;font-weight:500;color:var(--ink-soft);transition:.12s;user-select:none}
.pv-photolabel:hover:not(.pv-photolabel-dis){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.pv-photolabel.pv-photolabel-dis{opacity:.5;cursor:not-allowed}
.pv-photofile{display:none}
.pv-photostate{font-size:11.5px;color:var(--muted)}
.pv-photostate.pending{color:var(--warn)}
.pv-photostate.ok{color:var(--ok)}
.pv-photopreview{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pv-photoimg{max-width:240px;max-height:180px;border-radius:var(--radius-s);border:1.5px solid var(--line);object-fit:cover;display:block}
.pv-scanmodal video{width:100%;max-width:340px;border-radius:var(--radius-s);background:#000;margin-bottom:14px}
.pv-field-err{outline:2px solid var(--bad);outline-offset:4px;border-radius:8px;transition:outline-color .2s}
textarea.pv-in{width:100%;resize:vertical;min-height:72px}
.pv-md{line-height:1.65}.pv-md h1,.pv-md h2,.pv-md h3,.pv-md h4{margin:.4em 0 .3em;line-height:1.25}
.pv-md h1{font-size:1.4em}.pv-md h2{font-size:1.2em}.pv-md h3{font-size:1.05em}
.pv-md p{margin:.5em 0}.pv-md ul,.pv-md ol{padding-left:1.4em;margin:.4em 0}.pv-md li{margin:.15em 0}
.pv-md blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.3em .9em;color:var(--ink-soft);background:rgba(0,0,0,.02)}
.pv-md code{font-family:var(--mono);font-size:.9em;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
.pv-md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}
.pv-md a{color:var(--accent)}
.pv-radios{display:flex;flex-direction:column;gap:2px}
.pv-opt{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 9px;border-radius:7px;cursor:pointer;margin:0 -5px;transition:background .1s}
.pv-opt:hover{background:var(--panel-2)}
.pv-opt input[type=radio],.pv-opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}
.pv-note{background:linear-gradient(135deg,var(--accent-soft),#ecf7f9);border:1px solid #c3dfe5;border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.55}
.pv-loading{font-size:12.5px;color:var(--muted);padding:9px 11px;border:1px dashed var(--line);border-radius:7px;background:var(--panel-2)}

/* ---- roster row page header ---- */
.pv-rrow-hdr{max-width:660px;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent) 0%,#0891b2 100%);border-radius:var(--radius);padding:16px 20px 18px;color:#fff}
.pv-rrow-bread{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pv-rrow-back{border:none;background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:3px 10px;border-radius:20px;font-family:inherit;transition:background .12s}
.pv-rrow-back:hover{background:rgba(255,255,255,.3)}
.pv-rrow-sep{font-size:12px;opacity:.5}
.pv-rrow-rname{font-size:12px;opacity:.75;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-rrow-num{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;letter-spacing:.03em;flex:none}
.pv-rrow-title{font-size:18px;font-weight:700;line-height:1.3;color:#fff}

/* ---- roster ---- */
.pv-roster{border:1.5px solid #b5dfc7;border-radius:10px;padding:16px;margin-bottom:16px;background:#f4fcf8}
.pv-roster-err{border-color:var(--bad)!important;outline:2px solid var(--bad);outline-offset:2px}
.pv-rh{font-weight:700;font-size:13.5px;color:var(--roster);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pv-tag{font-family:var(--mono);font-size:9.5px;background:#d8f3e5;padding:2px 6px;border-radius:4px;color:var(--roster);font-weight:600;vertical-align:middle}
.pv-rowempty{font-size:12px;color:var(--muted);padding:4px 0 10px}
.pv-rowlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pv-rowitem{display:flex;align-items:center;gap:10px;border:1px solid #d8eedf;border-radius:8px;background:var(--panel);padding:11px 14px;transition:border-color .1s}
.pv-rowitem:hover{border-color:#99d4b4}
.pv-rowinfo{flex:1;min-width:0}
.pv-rowinfo b{font-size:13px;font-weight:600;display:block}
.pv-rowinfo span{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-top:2px}
.pv-rowinfo i{color:var(--muted)}
.pv-rowopen{border:1px solid var(--roster);background:var(--panel);color:var(--roster);border-radius:6px;padding:7px 13px;font-weight:600;font-size:12px;cursor:pointer;flex:none;transition:.1s}
.pv-rowopen:hover{background:#edfaf4}
.pv-rowdel{border:none;background:transparent;color:var(--bad);font-size:11.5px;cursor:pointer;flex:none;padding:4px 7px;border-radius:5px;transition:.1s}
.pv-rowdel:hover{background:var(--bad-soft)}
.pv-row{border:1px solid #dceee4;border-radius:8px;background:var(--panel);padding:14px 16px;margin-bottom:10px}
.pv-rownum{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.pv-del{border:none;background:transparent;color:var(--bad);font-size:11.5px;cursor:pointer;padding:3px 6px;border-radius:5px;transition:.1s}
.pv-del:hover{background:var(--bad-soft)}
.pv-add{border:1.5px dashed #7cc9a0;background:transparent;color:var(--roster);border-radius:8px;padding:10px;width:100%;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.pv-add:hover{background:#edfaf4;border-color:#47b077;border-style:solid}

/* ---- save draft button ---- */
.pv-savedraft{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--radius-s);padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap}
.pv-savedraft:hover:not(:disabled){border-color:#c6cdd6;background:var(--panel-2)}
.pv-savedraft:disabled{opacity:.5;cursor:not-allowed}
.pv-savedraft.saved{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* ---- modal ---- */
.pv-modal-bg{position:fixed;inset:0;background:rgba(19,23,30,.5);display:flex;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(2px)}
.pv-modal{background:var(--panel);border-radius:var(--radius);padding:24px;max-width:400px;width:92%;box-shadow:0 8px 40px -8px rgba(19,23,30,.3)}
.pv-modal h3{margin:0 0 4px;font-size:16px;font-weight:700}
.pv-modal .pv-modal-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.pv-modal input,.pv-modal-in{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-s);padding:10px 11px;font-size:13px;margin-bottom:12px;box-sizing:border-box;transition:border-color .15s,box-shadow .15s;font-family:inherit;color:var(--ink)}
.pv-modal input:focus,.pv-modal-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pv-modal-actions{display:flex;justify-content:flex-end;gap:8px}
.pv-modal.pv-queuemodal{max-width:560px}
/* Three actions instead of the usual two: let them keep their natural width and
   drop to a second row rather than shrink until the labels break mid-phrase. */
.pv-queuemodal .pv-modal-actions{flex-wrap:wrap}
.pv-queuemodal .pv-modal-actions .btn{white-space:nowrap;flex:0 0 auto}
.pv-qlist{max-height:52vh;overflow:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:var(--radius-s)}
.pv-qitem{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.pv-qitem:last-child{border-bottom:none}
.pv-qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:3px}
.pv-qkind{font-weight:700}
.pv-qwhen{color:var(--muted);font-size:11.5px;white-space:nowrap}
.pv-qerr{color:var(--bad);margin-bottom:7px;word-break:break-word}
.pv-qacts{display:flex;gap:6px;flex-wrap:wrap}
.pv-qacts button{padding:4px 9px;font-size:11.5px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pv-qacts button.danger{color:var(--bad);border-color:var(--bad)}
.pv-qempty{padding:20px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---- navigation footer ---- */
.pv-nav-area{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:0 20px 4px;box-shadow:0 -2px 16px rgba(19,23,30,.06)}
.pv-nav{max-width:660px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 14px}
.pv-nav-err{max-width:660px;margin:0 auto;font-size:12.5px;text-align:center;color:var(--bad);padding:8px 0 0;min-height:0}
.pv-prog{font-size:12.5px;color:var(--muted);font-weight:500}
.msg{max-width:660px;margin:10px auto 0;padding:13px 16px;border-radius:9px;font-size:13.5px;font-weight:500;display:none}
.msg.ok{background:var(--ok-soft);color:var(--ok);display:block;border:1px solid #a3e5b6}
.msg.err{background:var(--bad-soft);color:var(--bad);display:block;border:1px solid #f3b8b0}
.view-hint{max-width:660px;margin:10px auto 0;font-size:13px;color:var(--muted);padding:11px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-s)}
.foot{text-align:center;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:20px 0 6px}

/* ---- buttons ---- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:var(--radius-s);font-size:13px;font-weight:500;transition:.12s;cursor:pointer}
.btn:hover{border-color:#c6cdd6;background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:10px 24px;border-radius:var(--radius-s)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.primary:disabled{opacity:.6;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{border-color:#fca5a5;color:#b91c1c;background:#fff5f5}
.btn.danger:hover{background:#fee2e2;border-color:#f87171}

/* ---- login gate ---- */
.gate-wrap{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--surface)}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px 30px;max-width:400px;width:92%;text-align:center;box-shadow:0 2px 4px rgba(19,23,30,.06),0 12px 40px -16px rgba(19,23,30,.2)}
.gate-icon{font-size:38px;margin-bottom:14px}
.gate-title{font-size:18px;font-weight:700;margin:0 0 6px}
.gate-sub{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.55}
.gate-form{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:18px;display:block}
.google-btn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--panel);padding:11px 22px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;justify-content:center;transition:.12s}
.google-btn:hover{border-color:#c6cdd6;background:var(--panel-2)}
.google-btn svg{flex:none}
.gate-err{margin-top:12px;font-size:12.5px;color:var(--bad)}
.gate-card-wide{max-width:540px}
.gate-ubar{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.resp-list{text-align:left;margin:12px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.resp-item{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;column-gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.resp-item:last-child{border-bottom:none}
.resp-item-clickable{cursor:pointer;transition:background .12s}
.resp-item-clickable:hover,.resp-item-clickable:focus-visible{background:var(--panel-2)}
.resp-item-clickable:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px}
.resp-item-left{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;gap:7px;flex:1 1 auto;min-width:0}
.resp-item-right{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;gap:10px;flex:0 0 auto;margin-left:auto}
.resp-num{font-weight:600;white-space:nowrap}
.resp-date{color:var(--muted);font-size:12px;white-space:nowrap}
.resp-badge{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
.resp-badge-draft{background:#fef9c3;color:#854d0e}
.resp-badge-ok{background:#dcfce7;color:#15803d}
.btn-xs{padding:4px 10px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}

/* ---- View Response (read-only overlay for submitted answers) ---- */

  .pv-nav>div:last-child .btn,

</head>
<body>
<div id="root"><div class="init-wrap"><span class="init-msg">Loading form…</span></div></div>
<script src="/offline-queue.js"></script>
<script src="/image-compress.js"></script>
<script src="/searchable-select.js"></script>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/geo-map.js"></script>
<script>
const SHARE_TOKEN=location.pathname.split("/").filter(Boolean).pop();

/* The icon and manifest are attached here, at parse time, rather than after the
   instrument JSON arrives.

   On a phone the difference is the whole feature. "Add to home screen" pressed before
   the manifest exists gives a plain bookmark instead of an installed app, and a plain
   bookmark takes its picture from the favicon — of which there was none, so the icon
   came out blank. Both now exist from the first paint, and neither depends on a
   network round trip that a field connection may take seconds to finish. */
(function installHeadIcons(){
  const icon=size=>"/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/icon.png?size="+size;
  const add=(rel,href,extra)=>{
    const l=document.createElement("link");l.rel=rel;l.href=href;
    if(extra)Object.assign(l,extra);
    document.head.appendChild(l);
  };
  add("icon",icon(32),{type:"image/png",sizes:"32x32"});
  add("icon",icon(192),{type:"image/png",sizes:"192x192"});
  add("apple-touch-icon",icon(180));
  const theme=document.createElement("meta");
  theme.name="theme-color";theme.content="#0e7490";document.head.appendChild(theme);
  // The manifest 404s for forms without offline mode — those are not installable, which
  // is deliberate. Declaring it unconditionally costs one ignorable console warning and
  // removes the race for the forms that are.
  const m=document.createElement("link");m.id="pvManifestLink";m.rel="manifest";
  m.href="/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/manifest.webmanifest";
  document.head.appendChild(m);
})();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt=v=>v==null?"":(typeof v==="object"?(v.id||Object.values(v)[0]||""):v);

let SCHEMA=null, ALLOW=true, PW="", apiCache={};
/* Which snapshot of the instrument this page is showing. Sent back with every
   submission so the response records the questions that were actually put, rather than
   whatever the form has been edited into by the time the answers arrive — which,
   offline, can be days later. */
let SCHEMA_VERSION_ID="";
let PAGES=[], curPage=0, answers={};
let rosterView=null;
let RESP_TOKEN=localStorage.getItem("eform_resp_token")||"";
let RESP_USER=null;
let EXISTING_RESPONSE=null;
let MULTI_RESPONSE=false;  // whether one account may submit more than one response
let ACCESS_MODE="public";  // 'public' or 'restricted'
let EDITING_RESPONSE_ID=null; // the form_responses row id currently being edited (draft mode)
let DRAFT_RESTORED_AT=null; // timestamp of the local draft in use (null when there is none)
let AUTOSAVE_TIMER=null;
let PENDING_UPLOADS={};
let OFFLINE_MODE=false; // settings.offline.enabled on the instrument AND a multi-response share
let DEFERRED_INSTALL_PROMPT=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED_INSTALL_PROMPT=e;renderInstallButton();});

try{RESP_USER=JSON.parse(localStorage.getItem("eform_resp_user")||"null");}catch(_){}

/* ---- local draft/autosave: keep progress in localStorage so it is not lost if
   the tab closes or the connection drops before "Submit". ---- */
function draftKey(){return RESP_USER?`eform_draft_${SHARE_TOKEN}_${RESP_USER.id}`:null;}
function saveDraft(){
  const key=draftKey();if(!key)return;
  try{localStorage.setItem(key,JSON.stringify({answers,curPage,savedAt:new Date().toISOString()}));}catch(_){}
}
function loadDraft(){
  const key=draftKey();if(!key)return null;
  try{const raw=localStorage.getItem(key);if(!raw)return null;return JSON.parse(raw);}catch(_){return null;}
}
function clearDraft(){
  const key=draftKey();if(!key)return;
  try{localStorage.removeItem(key);}catch(_){}
}

/* ---- PWA & offline queue (multi-response forms with offline mode enabled only) ----
   The queue itself is in /offline-queue.js, loaded by this page and imported by
   web/sw.js so both run the identical flush. ---- */
// The manifest, icons and theme colour are installed at parse time by
// installHeadIcons(). What is left here needs to know that offline mode is on: the
// service worker, the cache warm-up and the queue wiring.
let PWA_READY=false;
function setupPWA(){
  if(PWA_READY)return;
  PWA_READY=true;
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").catch(()=>{});
    // A service worker only controls the page AFTER the initial requests finish, so
    // a first visit caches nothing and a user who heads straight into the field
    // gets a blank page. The Cache API is reachable from the page, so the warm-up
    // happens here instead of waiting for a second load.
    warmOfflineCache();
    // Background sync can run with no page open, so the outcome comes back over
    // postMessage to keep the badge from going stale.
    navigator.serviceWorker.addEventListener("message",e=>{
      if(e.data&&e.data.type==="eform-queue")updateOfflineBadge();
    });
  }
}
async function warmOfflineCache(){
  if(!("caches" in window))return;
  try{
    const c=await caches.open(OFFLINE_CACHE);
    const urls=[location.pathname,"/api/public/forms/"+encodeURIComponent(SHARE_TOKEN),
                "/searchable-select.js","/geo-map.js","/image-compress.js",
                "/vendor/leaflet/leaflet.js","/vendor/leaflet/leaflet.css"];
    // One at a time: with addAll a single failure would discard the whole warm-up.
    await Promise.all(urls.map(u=>c.add(u).catch(()=>{})));
  }catch(_e){}
}
function renderInstallButton(){
  const wrap=document.getElementById("pvInstallWrap");if(!wrap)return;
  if(!(OFFLINE_MODE&&DEFERRED_INSTALL_PROMPT)){wrap.innerHTML="";return;}
  wrap.innerHTML='<button class="btn" id="pvInstallBtn" style="padding:5px 10px;font-size:12px">⬇ Install App</button>';
  wrap.querySelector("#pvInstallBtn").onclick=async()=>{
    const prompt=DEFERRED_INSTALL_PROMPT;if(!prompt)return;
    prompt.prompt();await prompt.userChoice;DEFERRED_INSTALL_PROMPT=null;renderInstallButton();
  };
}
function updateOfflineBadge(){
  const el=document.getElementById("pvOfflineBadge");if(!el)return;
  // Permanent failures are shown separately: a count that never goes down reads
  // like "still processing" when it actually needs someone to act.
  queueStats().then(({pending,failed})=>{
    const parts=[];
    if(pending>0)parts.push(`⏳ ${pending} waiting to be sent`);
    if(failed>0)parts.push(`⚠ ${failed} rejected`);
    el.textContent=parts.join(" · ");
    const dapatDiklik=failed>0;
    el.style.cssText=parts.length?`font-size:11px;color:var(--${failed>0?"bad":"warn"});white-space:nowrap${dapatDiklik?";cursor:pointer;text-decoration:underline":""}`:"";
    // A count nobody can act on is just an alarm with no off switch, so once
    // something has been rejected the badge becomes the way into the list.
    el.title=dapatDiklik?"Tap to review the rejected items.":"";
    el.onclick=dapatDiklik?openQueueDialog:null;
  });
}
/* ---- rejected-items review ----
   These records hold answers and photos that exist nowhere else: the server refused
   them, so there is no copy on the server either. The list therefore offers retry
   and export before it offers deletion. */
function fmtWhen(ms){
  if(!ms)return "";
  const d=new Date(ms);
  return d.toLocaleString(undefined,{dateStyle:"short",timeStyle:"short"});
}
function fmtSize(bytes){
  if(!bytes)return "";
  return bytes<1024?`${bytes} B`:bytes<1048576?`${(bytes/1024).toFixed(0)} KB`:`${(bytes/1048576).toFixed(1)} MB`;
}
async function openQueueDialog(){
  const bg=document.createElement("div");bg.className="pv-modal-bg";
  bg.innerHTML=`<div class="pv-modal pv-queuemodal">
    <h3>Rejected items</h3>
    <p class="pv-modal-sub">The server refused these, so they were kept on this device instead of being lost. Retry after fixing the cause — signing in again, for instance. Download a copy before discarding anything.</p>
    <div class="pv-qlist" id="pvQList"><div class="pv-qempty">Loading…</div></div>
    <div class="pv-modal-actions">
      <button class="btn ghost" id="pvQExport">Download copy</button>
      <button class="btn ghost" id="pvQRetryAll">Retry all</button>
      <button class="btn primary" id="pvQClose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector("#pvQClose").addEventListener("click",close);
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  const list=bg.querySelector("#pvQList");

  async function draw(){
    let items=[];
    try{items=await OQ.listFailed();}catch(_e){}
    if(!items.length){
      list.innerHTML=`<div class="pv-qempty">Nothing was rejected.</div>`;
      return;
    }
    list.innerHTML=items.map(it=>{
      const heading=it.kind==="file"
        ?`Photo${it.name?" · "+esc(it.name):""}${it.size?" · "+fmtSize(it.size):""}`
        :`Response${it.answerCount!=null?" · "+it.answerCount+" answer"+(it.answerCount===1?"":"s"):""}`;
      const sebab=[it.status?"HTTP "+it.status:"",esc(it.error||"Rejected.")].filter(Boolean).join(" — ");
      return `<div class="pv-qitem" data-kind="${it.kind}" data-id="${it.id}">
        <div class="pv-qhead"><span class="pv-qkind">${heading}</span><span class="pv-qwhen">${esc(fmtWhen(it.failedAt||it.ts))}</span></div>
        <div class="pv-qerr">${sebab}</div>
        <div class="pv-qacts">
          <button data-act="retry">Retry</button>
          ${it.kind==="file"?`<button data-act="save">Save photo</button>`:""}
          <button data-act="discard" class="danger">Discard</button>
        </div>
      </div>`;
    }).join("");
  }
  await draw();

  list.addEventListener("click",async e=>{
    const btn=e.target.closest("button[data-act]");if(!btn)return;
    const row=btn.closest(".pv-qitem");
    const kind=row.dataset.kind,id=Number(row.dataset.id);
    if(btn.dataset.act==="retry"){
      await OQ.retryFailed(kind,id);
      await flushOfflineQueue();
      await draw();updateOfflineBadge();
      return;
    }
    if(btn.dataset.act==="save"){
      const rec=await OQ.getFile(id);
      if(rec&&rec.blob)downloadBlob(rec.blob,rec.name||`photo-${id}.jpg`);
      return;
    }
    // Deletion is the one step that cannot be undone, and what it deletes is data
    // the server never received — so it is spelled out rather than confirmed vaguely.
    if(!confirm("Discard this permanently? It was never received by the server, so this is the only copy."))return;
    await OQ.discardFailed(kind,id);
    await draw();updateOfflineBadge();
  });

  bg.querySelector("#pvQRetryAll").addEventListener("click",async()=>{
    await OQ.retryAllFailed();
    await flushOfflineQueue();
    await draw();updateOfflineBadge();
  });
  bg.querySelector("#pvQExport").addEventListener("click",async()=>{
    const dump=await OQ.exportFailed();
    downloadBlob(new Blob([JSON.stringify(dump,null,2)],{type:"application/json"}),
      `eform-rejected-${new Date().toISOString().slice(0,10)}.json`);
  });
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
}
// The queue itself lives in /offline-queue.js, shared with the service worker.
const OQ=self.EformOfflineQueue;
// Taken from the shared module, not repeated here. This used to be its own string with
// a comment saying it must match sw.js; it stopped matching, and because the worker
// deletes every cache but its own on activate, the warm-up below was thrown away on the
// first visit — the one visit it exists for.
const OFFLINE_CACHE=OQ.CACHE_NAME;
function isNetworkError(e){return !navigator.onLine||e instanceof TypeError;}
async function requestBackgroundSync(){
  try{
    if("serviceWorker" in navigator&&"SyncManager" in window){
      const reg=await navigator.serviceWorker.ready;await reg.sync.register("eform-flush");
    }
  }catch(_e){}
}
async function queueOfflineRequest(url,headers,body){
  await OQ.queueRequest(url,headers,body);
  await requestBackgroundSync();
  updateOfflineBadge();
  // Usually a no-op right now — queueing happens because the network is down — but it
  // gets the report out immediately in the case where the server refused rather than
  // the connection failing.
  reportQueueState();
}
// Keep the photo on this device and hand back the placeholder the answer carries
// until flush() can swap in the real URL.
async function storeOfflineUpload(file,fieldType){
  const url="/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/uploads";
  const ref=await OQ.storeFile(url,pubHeaders({}),file,file.name||"",fieldType);
  await requestBackgroundSync();
  return ref;
}
function queueStats(){return OQ?OQ.stats():Promise.resolve({pending:0,failed:0});}

/* ---- reporting the backlog to the server ----
   A queue stranded on one phone is invisible to the office, and if that phone breaks
   the work is gone with no trace it ever existed. So the device tells the server what
   it is still holding.

   The endpoint needs a valid respondent session, which means the one failure we most
   want reported — an expired token — is also the one that cannot be reported at the
   moment it happens. That is why this is sent on every load and after every flush
   rather than only when something breaks: the last successful report keeps standing,
   and the dashboard treats its AGE as the warning. */
const DEVICE_KEY="eform_device_id",REPORTED_KEY="eform_queue_reported";
function deviceId(){
  let v="";
  try{v=localStorage.getItem(DEVICE_KEY)||"";}catch(_e){}
  if(!v){
    v=(self.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2))
      .replace(/[^a-zA-Z0-9]/g,"").slice(0,32);
    try{localStorage.setItem(DEVICE_KEY,v);}catch(_e){}
  }
  return v;
}
async function reportQueueState(){
  if(!OFFLINE_MODE||!OQ||!RESP_TOKEN)return;
  let body;
  try{body=await OQ.reportPayload(deviceId());}catch(_e){return;}
  const adaIsi=body.pending>0||body.failed>0||body.files>0;
  let pernahLapor=false;
  try{pernahLapor=localStorage.getItem(REPORTED_KEY)==="1";}catch(_e){}
  // Nothing to say and nothing outstanding to retract: stay quiet rather than send a
  // request per page load for every user whose queue is simply empty.
  if(!adaIsi&&!pernahLapor)return;
  try{
    const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/queue-report",{
      method:"POST",
      headers:pubHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify(body)
    });
    if(!r.ok)return; // offline or the token expired — the previous report still stands
    try{localStorage.setItem(REPORTED_KEY,adaIsi?"1":"0");}catch(_e){}
  }catch(_e){}
}
async function flushOfflineQueue(){
  if(!navigator.onLine)return;
  let r=null;
  try{r=await OQ.flush();}catch(_e){}
  if(r&&r.map)applyResolvedUploads(r.map);
  updateOfflineBadge();
  reportQueueState();
}
/* Once a photo is on the server the placeholder in the answers is stale — and worse
   than stale: the file record behind it has been deleted, so an edit saved later
   would queue an answer whose attachment can never be found. Swap in the real URLs
   and persist. */
function applyResolvedUploads(map){

function mediaSourceOf(val){
  if(!val)return "";

  if(/^https?:\/\//i.test(s)||s.startsWith("/")||s.startsWith("blob:"))return s;

      if(c===")"){t.push({t:"rp"});i++;continue;}
      if(c==="["){t.push({t:"lb"});i++;continue;}
      if(c==="]"){t.push({t:"rb"});i++;continue;}

function coerceVal(v){if(v==="true")return true;if(v==="false")return false;if(typeof v==="string"&&v.trim()!==""&&!isNaN(Number(v)))return Number(v);return v;}

  while(p){
    out.push(p);

    if(!m||m[1]===p)break;

function resolveScopedAnswer(name,rowPrefix){

function refResolve(name,rowPrefix){

       "3" must not silently turn every ${3.12} into an empty array. Decided from the
       schema, not from the answers, so resolution cannot change once the respondent
       starts filling the form in. Mirrors refResolve() in builder.js. */

      const dot=name.indexOf(".");const rn=name.slice(0,dot),fn=name.slice(dot+1);
      const r=findRoster(rn);
      if(r){const cnt=rosterCount(r);const arr=[];for(let i=0;i<cnt;i++)arr.push(coerceVal(answers[`${rn}#${i}#${fn}`]));return arr;}
    }

/* ---- headers helper ---- */
function pubHeaders(extra){
  const h={...extra};
  if(PW)h["X-Share-Password"]=PW;
  if(RESP_TOKEN)h["Authorization"]="Bearer "+RESP_TOKEN;

/* ---- HTML sanitiser for note fields (safe tags only) ---- */
function sanitizeHtml(html){
  const ALLOWED={A:['href','target','rel'],B:[],STRONG:[],I:[],EM:[],U:[],S:[],
    P:[],BR:[],UL:[],OL:[],LI:[],BLOCKQUOTE:[],H1:[],H2:[],H3:[],H4:[],H5:[],H6:[],CODE:[],PRE:[],HR:[]};
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  (function clean(node){
    for(const n of [...node.childNodes]){
      if(n.nodeType===3)continue;
      if(n.nodeType!==1){n.remove();continue;}
      if(!ALLOWED[n.tagName]){n.replaceWith(document.createTextNode(n.textContent));continue;}
      for(const a of [...n.attributes])if(!ALLOWED[n.tagName].includes(a.name))n.removeAttribute(a.name);
      if(n.tagName==='A'){
        const href=n.getAttribute('href')||'';
        if(!/^https?:\/\//.test(href)&&!href.startsWith('/'))n.setAttribute('href','#');
        n.setAttribute('rel','noopener noreferrer');
      }
      clean(n);
    }
  })(tmp);
  return tmp.innerHTML;
}

/* ---- markdown ---- */
function mdToHtml(src){
  if(!src)return"";
  const e=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl=s=>e(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,text,url)=>{const safe=/^https?:\/\//.test(url)||url.startsWith('/')?url:'#';return`<a href="${safe}" target="_blank" rel="noopener noreferrer">${text}</a>`;});
  const L=String(src).replace(/\r\n/g,"\n").split("\n");let h="",i=0;
  while(i<L.length){const l=L[i];
    let m=l.match(/^\s*(#{1,6})\s+(.*)$/);if(m){h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;i++;continue;}
    if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){it.push(`<li>${inl(L[i].replace(/^\s*[-*]\s+/,""))}</li>`);i++;}h+=`<ul>${it.join("")}</ul>`;continue;}
    if(/^\s*\d+\.\s+/.test(l)){const it=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){it.push(`<li>${inl(L[i].replace(/^\s*\d+\.\s+/,""))}</li>`);i++;}h+=`<ol>${it.join("")}</ol>`;continue;}
    if(/^\s*>\s?/.test(l)){const q=[];while(i<L.length&&/^\s*>\s?/.test(L[i])){q.push(inl(L[i].replace(/^\s*>\s?/,"")));i++;}h+=`<blockquote>${q.join("<br>")}</blockquote>`;continue;}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){h+="<hr>";i++;continue;}
    if(/^\s*$/.test(l)){i++;continue;}
    const para=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^\s*(#{1,6}\s|[-*]\s|\d+\.\s|>\s?|-{3,}|\*{3,})/.test(L[i])){para.push(inl(L[i]));i++;}
    h+=`<p>${para.join("<br>")}</p>`;
  }
  return h;
}

/* ---- fetch form ---- */
async function fetchForm(){
  const headers=PW?{"X-Share-Password":PW}:{};
  const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN),{headers});
  const data=await r.json();
  if(r.status===401){askPassword(data.error);return;}
  if(!r.ok)throw new Error(data.error||"Failed to load");
  SCHEMA=data.schema; ALLOW=data.allowResponses;
  SCHEMA_VERSION_ID=data.schemaVersionId||"";
  MULTI_RESPONSE=!!data.multiResponse;
  ACCESS_MODE=data.accessMode||"public";
  OFFLINE_MODE=!!(SCHEMA?.settings?.offline?.enabled)&&MULTI_RESPONSE;
  if(OFFLINE_MODE){
    setupPWA();
    // The flush at the bottom of this file runs before the instrument is loaded, so
    // OFFLINE_MODE is still false there and the report would be skipped. This is the
    // first moment we know the form uses offline mode at all.
    flushOfflineQueue().catch(()=>{});
  }

  if(!data.googleEnabled){
    setRoot(`<div class="init-wrap"><div class="pw-card"><div class="msg err" style="display:block">Google login has not been configured by the administrator.</div></div></div>`);
    return;
  }

  if(!RESP_TOKEN){
    renderLoginGate(data);
    return;
  }

  let meR,meNetworkErr=false;
  try{meR=await fetch("/api/public/me",{headers:{"Authorization":"Bearer "+RESP_TOKEN}});}
  catch(e){meNetworkErr=isNetworkError(e);if(!meNetworkErr)throw e;}
  if(meNetworkErr){
    // Genuinely offline (a PWA opened without internet, say): do not force a logout, reuse the session
    // already stored on the device since the last online sign-in.
    if(!RESP_USER){renderLoginGate(data);return;}
  }else if(!meR.ok){
    clearRespSession();
    renderLoginGate(data);
    return;
  }else{
    RESP_USER=await meR.json();
    localStorage.setItem("eform_resp_user",JSON.stringify(RESP_USER));
  }

  // Check access when the share is restricted
  if(ACCESS_MODE==="restricted"){
    try{
      const ar=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/check-access",
        {headers:pubHeaders({})});
      const ad=await ar.json();
      if(!ad.allowed){
        renderAccessDenied(data);
        return;
      }
    }catch(e){
      // Being unable to ask is not the same as being refused. The session check just
      // above already decided that an offline device keeps the sign-in it made when it
      // last had a connection, and this has to follow it — otherwise offline mode is
      // dead for every restricted share, which is most of them in the field.
      //
      // Nothing is granted by letting the form open: the queued submission carries the
      // same token and the server checks access again before accepting it, so a
      // revoked account still cannot get data in. The answers stay on the device.
      if(!isNetworkError(e)){showErr("Failed to check access rights.");return;}
    }
  }

  // Multi-response mode: ALWAYS show the list first
  if(MULTI_RESPONSE){
    const prevResps=await fetchMyResponses();
    renderMyResponsesList(data,prevResps);
    return;
  }

  // Single-response: try to load the previous answer
  const lastResp=await fetchMyResponse();
  if(lastResp&&lastResp.status==="draft"){
    // A response that was just unsubmitted — carry on editing it
    // as a draft, not as a final answer.
    EXISTING_RESPONSE=null;
    EDITING_RESPONSE_ID=lastResp.id;
    answers=parseAnswers(lastResp.answers);
  }else{
    EXISTING_RESPONSE=lastResp;
    if(EXISTING_RESPONSE){
      answers=parseAnswers(EXISTING_RESPONSE.answers);
    }
  }

  // Pick the freshest source: the final answer, the server draft, or the local draft
  let restorePage=null;
  const serverTime=EXISTING_RESPONSE?new Date(EXISTING_RESPONSE.submittedAt):null;

  // Draf server
  const serverDraft=await fetchMyDraft();
  const serverDraftTime=serverDraft?new Date(serverDraft.savedAt):null;

  // Draf lokal
  const localDraft=loadDraft();
  const localDraftTime=localDraft&&localDraft.savedAt?new Date(localDraft.savedAt):null;

  // Decide which draft to use (newer than the final answer)
  const useServerDraft=serverDraftTime&&(!serverTime||serverDraftTime>serverTime)&&(!localDraftTime||serverDraftTime>=localDraftTime);
  const useLocalDraft=!useServerDraft&&localDraftTime&&localDraft.answers&&Object.keys(localDraft.answers).length&&(!serverTime||localDraftTime>serverTime);

  if(useServerDraft){
    answers=parseAnswers(serverDraft.answers);
    restorePage=serverDraft.curPage||0;
    DRAFT_RESTORED_AT=serverDraft.savedAt;
    clearDraft(); // bring the local copy in line with the server
  }else if(useLocalDraft){
    answers=localDraft.answers;
    restorePage=localDraft.curPage||0;
    DRAFT_RESTORED_AT=localDraft.savedAt||null;
  }else{
    clearDraft();
  }

  render(data);
  if(restorePage!=null)goToPage(restorePage);
}

function parseAnswers(raw){
  if(typeof raw==="object"&&raw!==null)return raw;
  try{return JSON.parse(raw)||{};}catch{return{};}
}
function formatDraftTime(iso){
  try{return new Date(iso).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}catch(_){return"";}
}

async function fetchMyResponse(){
  try{
    const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/my-response",
      {headers:pubHeaders({})});
    if(!r.ok)return null;
    return await r.json();
  }catch{return null;}
}

async function fetchMyResponses(){
  try{
    const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/my-responses",
      {headers:pubHeaders({})});
    if(!r.ok)return [];
    const d=await r.json();
    return d.responses||[];
  }catch{return [];}
}

function renderAccessDenied(meta){
  const title=txt(meta.title||txt(SCHEMA?.title)||"Form");
  document.title=title;
  setRoot(`<div class="gate-wrap"><div class="gate-card">

let _responseMap={};
function renderMyResponsesList(meta,responses){
  const title=txt(meta.title||txt(SCHEMA?.title)||"Form");

    return `<div class="resp-item${isDraft?"":" resp-item-clickable"}"${rowAttrs}>
      <div class="resp-item-left"><span class="resp-num">Response ${responses.length-i}</span>${badge}</div>
      <div class="resp-item-right">
        <span class="resp-date">${isDraft?"Draft · "+fmt(r.submittedAt):fmt(r.submittedAt)}</span>

  const emptyNote=responses.length===0?`<div class="muted" style="padding:12px;text-align:center;font-size:13px">No responses yet.</div>`:"";
  const newBtn=ALLOW&&!hasDraft
    ?`<button class="btn primary" style="margin-top:16px;width:100%" onclick="startNewResponse()">+ New Response</button>`
    :(ALLOW&&hasDraft?`<p class="gate-sub muted" style="font-size:12px;margin-top:12px">Finish or discard the existing draft before adding a new response.</p>`:"");
  setRoot(`<div class="gate-wrap"><div class="gate-card gate-card-wide">
    ${userBar}
    <div class="gate-icon">📋</div>
    <h2>${esc(title)}</h2>
    <p class="gate-sub">${responses.length===0?"You have no responses for this form yet.":"You have "+responses.length+" responses for this form."}</p>
    <div class="resp-list">${emptyNote}${rows}</div>

/* ==================== View Response (read-only mode for respondents) ====================
   Reached from the response list (multi-response) so a respondent can look at a submitted
   answer without having to Unsubmit first. Deliberately kept separate from the form's own
   render engine — which is tightly bound to the global `answers` currently being filled in
   — so it cannot disturb a draft in progress. It follows the rv-* pattern already used in
   response-view.html / portal-response-view.html (read-only + skip-to). */
let VIEW_RESP=null,VIEW_ANSWERS={},VIEW_PAGES=[],VIEW_VISITED=[],VIEW_CUR=0;
const VIEW_CHOICE_TYPES=new Set(["select","multiselect","radio","checkbox"]);

function viewRefResolve(name,rowPrefix,ans){
  name=String(name).trim();
  if(rowPrefix){const k=rowPrefix+name;if(k in ans)return coerceVal(ans[k]);}
  return name in ans?coerceVal(ans[name]):undefined;
}
function viewEvalVisible(src,rowPrefix,ans){
  if(!src)return true;
  const v=Expr.evalSrc(src,name=>viewRefResolve(name,rowPrefix||"",ans));
  return v===undefined?true:!!v;
}
function viewRowInterp(text,ans,rowPrefix){
  if(!text)return text;
  return String(text).replace(INTERP_RE,(_,a,b)=>{
    const n=(a||b).trim();
    if(n==="index"){const idx=indexFromScopePrefix(rowPrefix);return idx!=null?String(idx):"";}
    const k=(rowPrefix||"")+n;
    if(k in ans)return String(ans[k]);
    if(n in ans)return String(ans[n]);
    return "";
  });
}
function viewNodeContainsName(node,target){if(node.name===target)return true;return (node.components||[]).some(c=>viewNodeContainsName(c,target));}
function viewPageIndexOfTarget(target,pages){
  if(!target||target==="__next"||target==="__prev")return null;
  if(target==="__end")return pages.length-1;
  for(let i=0;i<pages.length;i++){if(viewNodeContainsName(pages[i],target))return i;}
  return null;
}
function viewFieldSkipTarget(f,ans,rp){
  rp=rp||"";
  for(const s of f.skips||[]){
    if(!s.when||!s.to)continue;
    if(viewEvalVisible(s.when,rp,ans))return s.to;
  }
  if(VIEW_CHOICE_TYPES.has(f.type)&&Array.isArray(f.options)){
    const v=ans[rp+f.name];
    const sel=Array.isArray(v)?v.map(String):[String(v)];
    for(const o of f.options){if(o.skipTo&&sel.includes(String(o.value)))return o.skipTo;}
  }
  return null;
}
function viewFlatFields(node){
  const fields=[];
  (function walk(n){(n.components||[]).forEach(c=>{if(c.kind==="field")fields.push(c);else if(c.kind!=="roster")walk(c);});})(node);
  return fields;
}
function viewComputePageSkipState(page,ans){
  const hidden=new Set();
  const fields=viewFlatFields(page);
  let skipActive=false,skipTarget=null,crossPageTarget=null;
  for(const f of fields){
    if(skipActive){
      if(f.name===skipTarget){skipActive=false;skipTarget=null;}
      else{hidden.add(f.name);continue;}
    }
    const t=viewFieldSkipTarget(f,ans,"");
    if(t&&t!=="__next"){
      if(viewNodeContainsName(page,t)&&t!==f.name){skipActive=true;skipTarget=t;}
      else{skipActive=true;skipTarget=null;crossPageTarget=t;}
    }
  }
  return{hidden,crossPageTarget:skipActive?crossPageTarget:null};
}
function viewComputeRosterRowSkipState(roster,rowIdx,ans,parentRp){
  const rp=rosterRowPrefix(roster,rowIdx,parentRp||"");
  const allRowFields=viewFlatFields(roster);
  const allNames=new Set(allRowFields.map(f=>f.name));
  const hidden=new Set();
  let skipActive=false,skipTarget=null;
  for(const f of allRowFields){
    if(skipActive){
      if(skipTarget&&f.name===skipTarget){skipActive=false;skipTarget=null;}
      else{hidden.add(f.name);continue;}
    }
    const t=viewFieldSkipTarget(f,ans,rp);
    if(t==="__end"){skipActive=true;skipTarget=null;}
    else if(t&&allNames.has(t)&&t!==f.name){skipActive=true;skipTarget=t;}
  }
  return hidden;
}
function viewComputeVisitedPages(pages,ans){
  const visited=[];const guard=new Set();let idx=0;
  while(idx>=0&&idx<pages.length&&!guard.has(idx)){
    guard.add(idx);
    if(!viewEvalVisible(pages[idx].visibleWhen,"",ans)){idx+=1;continue;}
    visited.push(idx);
    const{crossPageTarget}=viewComputePageSkipState(pages[idx],ans);
    if(crossPageTarget){
      const t=viewPageIndexOfTarget(crossPageTarget,pages);
      if(t!=null&&t>idx){idx=t;continue;}
    }
    idx+=1;
  }
  return visited;
}
function viewGetRosterCount(r,ans,rowPrefix){
  const from=String(r.countFrom||"").trim();
  if(from){
    const raw=(rowPrefix&&(rowPrefix+from) in ans)?ans[rowPrefix+from]:ans[from];
    const cf=Math.floor(Number(raw));
    if(!Number.isFinite(cf)||cf<0)return 0;
    if(r.max!=null&&r.max!==""&&cf>Number(r.max))return Number(r.max);
    return cf;
  }
  const stored=ans[rosterCountKey(r,rowPrefix)];
  if(stored!=null){const n=Math.floor(Number(stored));return Number.isFinite(n)&&n>=0?n:0;}
  let max=-1;
  const prefix=rosterScopePrefix(r,rowPrefix);
  for(const k of Object.keys(ans)){
    if(k.startsWith(prefix)&&k!==rosterCountKey(r,rowPrefix)){
      const m=k.slice(prefix.length).match(/^(\d+)#/);
      if(m)max=Math.max(max,+m[1]);
    }
  }
  return max+1;
}
function viewBuildApiUrl(urlTpl,ans,rp){
  return urlTpl.replace(/\{([^}]+)\}/g,(_,k)=>encodeURIComponent((rp?(ans[rp+k]??ans[k]):ans[k])??''));
}
async function prefetchViewApiOptions(ans){
  const jobs=new Map();
  function collect(comps,rp){
    (comps||[]).forEach(c=>{
      if(c.kind==="block"||c.kind==="section")collect(c.components||[],rp);
      else if(c.kind==="roster"){
        const count=viewGetRosterCount(c,ans,rp);
        for(let i=0;i<count;i++)collect(c.components||[],rosterRowPrefix(c,i,rp));
      }else if(c.optionsApi&&c.optionsApi.url){
        const url=viewBuildApiUrl(c.optionsApi.url,ans,rp);
        if(url&&!apiCache[url])jobs.set(url,c.optionsApi);
      }
    });
  }
  (VIEW_PAGES||[]).forEach(pg=>collect(pg.components||[],""));
  await Promise.all([...jobs.entries()].map(async([url,cfg])=>{
    try{
      const r=await fetch("/api/options-proxy?url="+encodeURIComponent(url));
      const d=await r.json();
      let arr=cfg.path?getPath(d,cfg.path):(Array.isArray(d)?d:(d.data||d.items||d.results||[]));
      const vf=cfg.valueField||"code",lf=cfg.labelField||"label";
      apiCache[url]=(arr||[]).map(it=>({value:it[vf],label:txt(it[lf])||String(it[vf])}));
    }catch(e){}
  }));
}
function getViewOptions(c,ans,rp){
  const opts=[];
  const refKey=c.optionsRef||c.optionsTable;
  if(refKey&&SCHEMA){
    const t=(SCHEMA.referenceData||{})[refKey];
    if(t&&t.items)t.items.forEach(it=>opts.push({value:String(it.code),label:txt(it.label)}));
  }
  if(!opts.length&&c.options)
    c.options.forEach(o=>opts.push({value:String(o.value),label:txt(o.label)||String(o.value)}));
  if(!opts.length&&c.optionsApi&&c.optionsApi.url){
    const url=viewBuildApiUrl(c.optionsApi.url,ans,rp);
    const cached=apiCache[url];
    if(cached)cached.forEach(o=>opts.push(o));
  }
  return opts;
}
function renderViewNodes(comps,ans,rp,hiddenNames){
  return (comps||[]).map(c=>renderViewNode(c,ans,rp,hiddenNames)).join("");
}
function renderViewNode(c,ans,rp,hiddenNames){
  if(!viewEvalVisible(c.visibleWhen,rp,ans))return"";
  if(c.kind==="field"&&hiddenNames&&hiddenNames.has(c.name))return"";
  if(c.kind==="block")
    return `<div class="rv-block">${c.title?`<div class="rv-block-title">${esc(viewRowInterp(txt(c.title),ans,rp))}</div>`:""}${renderViewNodes(c.components||[],ans,rp,hiddenNames)}</div>`;
  if(c.kind==="section")
    return `<div class="rv-section">${c.title?`<div class="rv-section-title">${esc(viewRowInterp(txt(c.title),ans,rp))}</div>`:""}${renderViewNodes(c.components||[],ans,rp,hiddenNames)}</div>`;
  if(c.kind==="roster")return renderViewRoster(c,ans,rp);
  return renderViewField(c,ans,rp);
}
function renderViewField(c,ans,rp){
  if(c.type==="hidden")return"";
  if(c.type==="note")return c.html?`<div class="rv-note">${sanitizeHtml(txt(c.html))}</div>`:"";
  if(c.type==="markdown")return c.markdown?`<div class="rv-note rv-md">${mdToHtml(txt(c.markdown))}</div>`:"";
  const key=rp+c.name;
  const val=ans[key];
  const label=esc(viewRowInterp(txt(c.label)||c.name,ans,rp));
  const desc=c.description?`<div style="font-size:12px;color:var(--muted);margin-bottom:2px">${esc(viewRowInterp(txt(c.description),ans,rp))}</div>`:"";

  if(c.type==="radio"){
    const opts=getViewOptions(c,ans,rp);
    if(opts.length){
      const items=opts.map(o=>{
        const sel=String(val)===String(o.value);
        return `<div class="rv-choice-item ${sel?"selected":"unsel"}"><span class="rv-choice-icon"></span>${esc(o.label)}</div>`;
      }).join("");
      return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-choice-list">${items||"—"}</div></div>`;
    }
    if(val!=null&&val!=="")return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer">${esc(String(val))}</div></div>`;
  }
  if(c.type==="select"){
    const opts=getViewOptions(c,ans,rp);
    const found=opts.find(o=>String(o.value)===String(val));
    const display=found?found.label:(val!=null&&val!==""?String(val):null);
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer${display==null?" empty":""}">${display!=null?esc(display):"—"}</div></div>`;
  }
  if(c.type==="checkbox"||c.type==="multiselect"){
    const selected=Array.isArray(val)?val.map(String):(val?[String(val)]:[]);
    const opts=getViewOptions(c,ans,rp);
    if(opts.length){
      const items=opts.map(o=>{
        const sel=selected.includes(String(o.value));
        return `<div class="rv-choice-item ${sel?"selected":"unsel"}"><span class="rv-checkbox-icon"></span>${esc(o.label)}</div>`;
      }).join("");
      return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-choice-list">${items}</div></div>`;
    }
    const display=selected.length?selected.join(", "):"—";
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer-box">${esc(display)}</div></div>`;
  }
  if(c.type==="boolean"){
    const items=[{value:"true",label:"Yes"},{value:"false",label:"No"}].map(o=>{
      const sel=String(val)===o.value;
      return `<div class="rv-choice-item ${sel?"selected":"unsel"}"><span class="rv-choice-icon"></span>${o.label}</div>`;
    }).join("");
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-choice-list">${items}</div></div>`;
  }
  if(c.type==="geopoint"){
    const g=parseGeoPoint(val);
    const coordText=g?`${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}`:"—";
    const map=g?`<div class="geo-map" data-lat="${g.lat}" data-lng="${g.lng}"></div>`:"";
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer${g?"":" empty"}">${esc(coordText)}</div>${map}</div>`;
  }
  if(c.type==="photo"||c.type==="image"||c.type==="signature"||(c.type==="file"&&isImageSrc(getMediaSource(val)))){
    const src=getMediaSource(val);
    if(!src)return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer-box"><span style="color:var(--muted);font-style:italic">—</span></div></div>`;
    const alt=esc(viewRowInterp(txt(c.label)||c.name,ans,rp));
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-photo-wrap"><a class="rv-photo-link" href="${esc(src)}" target="_blank" rel="noreferrer">Open image</a><img class="rv-photo-img" src="${esc(src)}" alt="${alt}"></div></div>`;
  }
  if(c.type==="file"){
    const src=getMediaSource(val);
    if(!src)return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer empty">—</div></div>`;
    const mime=(src.match(/^data:([^;]+)/)||[])[1]||"file";
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer"><a href="${esc(src)}" download="file" style="color:var(--accent)">Download file (${esc(mime)})</a></div></div>`;
  }
  const display=val==null||val===""?null:String(val);
  const isEmpty=display==null;
  if(c.type==="textarea"||c.type==="text_long")
    return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer-box">${isEmpty?`<span style="color:var(--muted);font-style:italic">—</span>`:esc(display)}</div></div>`;
  return `<div class="rv-field"><div class="rv-label">${label}</div>${desc}<div class="rv-answer${isEmpty?" empty":""}">${isEmpty?"—":esc(display)}</div></div>`;
}
function renderViewRoster(r,ans,rp){
  rp=rp||"";
  const count=viewGetRosterCount(r,ans,rp);
  const title=esc(viewRowInterp(txt(r.title)||r.name,ans,rp));
  let html=`<div class="rv-roster"><div class="rv-roster-title">${title} <span style="font-weight:400;font-size:12px">(${count} rows)</span></div>`;
  if(count<=0){html+=`<div class="rv-empty">No data</div>`;}
  else{
    const rowLbl=(i,childRp)=>r.rowTitle?`${esc(viewRowInterp(txt(r.rowTitle),ans,childRp))} #${i+1}`:`Row #${i+1}`;
    for(let i=0;i<count;i++){
      const childRp=rosterRowPrefix(r,i,rp);
      const rowHidden=viewComputeRosterRowSkipState(r,i,ans,rp);
      html+=`<div class="rv-row"><div class="rv-row-num">${rowLbl(i,childRp)}</div>${renderViewNodes(r.components||[],ans,childRp,rowHidden)}</div>`;
    }
  }
  return html+`</div>`;
}
function renderViewFlatAnswers(ans){
  const entries=Object.entries(ans).filter(([k])=>!k.includes("#"));
  if(!entries.length)return `<div class="rv-block"><div class="rv-empty">No data</div></div>`;
  return `<div class="rv-block">`+entries.map(([k,v])=>
    `<div class="rv-field"><div class="rv-label" style="font-family:var(--mono);font-size:11.5px">${esc(k)}</div><div class="rv-answer">${esc(Array.isArray(v)?v.join(", "):String(v??""))}</div></div>`
  ).join("")+`</div>`;
}

async function viewSubmittedResponse(id){
  const r=_responseMap[id];
  if(!r)return;
  VIEW_RESP=r;
  VIEW_ANSWERS=parseAnswers(r.answers);
  VIEW_PAGES=(SCHEMA&&SCHEMA.pages)||[];
  openViewOverlay();
  await prefetchViewApiOptions(VIEW_ANSWERS);
  if(!document.getElementById("pvViewOverlay"))return; // closed before the prefetch finished
  VIEW_VISITED=viewComputeVisitedPages(VIEW_PAGES,VIEW_ANSWERS);
  VIEW_CUR=VIEW_VISITED.length?VIEW_VISITED[0]:0;
  renderViewPage();
}
let VIEW_HISTORY_PUSHED=false;
function openViewOverlay(){
  if(document.getElementById("pvViewOverlay"))return;
  // Unsubmit still requires the share to be active (ALLOW) — same as in the response list.
  const unsubmitBtn=ALLOW&&VIEW_RESP?`<button class="btn danger" onclick="unsubmitResponseAPI('${esc(VIEW_RESP.id)}')">Batalkan Submit</button>`:"";
  const ovl=document.createElement("div");
  ovl.className="pvview-overlay";
  ovl.id="pvViewOverlay";
  ovl.innerHTML=`<div class="pv-bar">
      <span class="pv-title">${esc(txt(SCHEMA?.title)||"Form")}</span>
      ${unsubmitBtn}
      <button class="btn" onclick="closeResponseViewer()">✕ Close</button>
    </div>
    <div class="pv-body" id="pvViewBody"><div style="padding:40px;text-align:center;color:var(--muted)">Loading…</div></div>
    <div class="pv-nav-area" id="pvViewFootArea" hidden><div class="pv-nav" id="pvViewFoot"></div></div>`;
  document.body.appendChild(ovl);
  // Push one history entry so the phone's back button (Android) closes this overlay
  // first (via the popstate below), rather than leaving the form page outright.
  history.pushState({pvView:true},"",location.href);
  VIEW_HISTORY_PUSHED=true;
}
function closeResponseViewer(){
  const ovl=document.getElementById("pvViewOverlay");
  if(!ovl)return;
  ovl.remove();
  VIEW_RESP=null;VIEW_ANSWERS={};VIEW_PAGES=[];VIEW_VISITED=[];VIEW_CUR=0;
  if(VIEW_HISTORY_PUSHED){
    VIEW_HISTORY_PUSHED=false;
    history.back(); // consume the entry pushed when the overlay opened, so it does not get stuck in history
  }
}
// Phone (Android)/browser back button: if the overlay is still open, just close it
// instead of navigating away from the form. No further history.back() is needed here,
// because this popstate is ALREADY the consequence of the back navigation.
window.addEventListener("popstate",()=>{
  const ovl=document.getElementById("pvViewOverlay");
  if(ovl){
    ovl.remove();
    VIEW_RESP=null;VIEW_ANSWERS={};VIEW_PAGES=[];VIEW_VISITED=[];VIEW_CUR=0;
    VIEW_HISTORY_PUSHED=false;
  }
});
function viewGoPage(idx){
  VIEW_CUR=idx;
  renderViewPage();
}
function renderViewPage(){
  const body=document.getElementById("pvViewBody");
  if(!body)return; // the overlay is already closed
  const ans=VIEW_ANSWERS,pages=VIEW_PAGES,visited=VIEW_VISITED;
  const visIdx=Math.max(0,visited.indexOf(VIEW_CUR));
  let html="";
  if(pages.length){
    const p=pages[VIEW_CUR]||pages[0];
    const hiddenNames=viewComputePageSkipState(p,ans).hidden;
    html=`<div class="pv-page"><h2 class="pv-h2">${esc(viewRowInterp(txt(p.title)||p.name||"Page "+(VIEW_CUR+1),ans,""))}</h2><div class="pv-card">${renderViewNodes(p.components||[],ans,"",hiddenNames)}</div></div>`;
  }else{
    html=`<div class="pv-page">${renderViewFlatAnswers(ans)}</div>`;
  }
  body.innerHTML=html;
  const footArea=document.getElementById("pvViewFootArea"),foot=document.getElementById("pvViewFoot");
  if(visited.length>1){
    footArea.hidden=false;
    foot.innerHTML=`<button class="btn" ${visIdx===0?"disabled":""} onclick="viewGoPage(${visited[Math.max(0,visIdx-1)]})">← Previous</button>`+
      `<span class="pv-prog">Page ${visIdx+1} / ${visited.length}</span>`+
      `<button class="btn" ${visIdx>=visited.length-1?"disabled":""} onclick="viewGoPage(${visited[Math.min(visited.length-1,visIdx+1)]})">Next →</button>`;
  }else{
    footArea.hidden=true;
  }
  body.scrollTop=0;
}

async function saveDraftToServer(){
  const btn=document.getElementById("pvSaveDraft");
  if(btn){btn.disabled=true;btn.textContent="Saving…";}
  if(!ensureNoPendingUploads()){
    if(btn){btn.disabled=false;btn.textContent="Save Draft";}
    return;
  }
  saveAnswers();
  const ans=collectAll();
  try{
    let savedAt,offlineQueued=false;
    if(MULTI_RESPONSE){
      // For multi-response, save the draft into form_responses (not response_drafts)
      const body={answers:ans,draft:true,schemaVersionId:SCHEMA_VERSION_ID};
      if(EDITING_RESPONSE_ID)body.responseId=EDITING_RESPONSE_ID;
      const url="/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/responses";
      const headers=pubHeaders({"Content-Type":"application/json"});
      let r;
      try{
        r=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});
      }catch(e){
        if(OFFLINE_MODE&&isNetworkError(e)){
          await queueOfflineRequest(url,headers,JSON.stringify(body));
          offlineQueued=true;savedAt=new Date().toISOString();
        }else throw new Error("No internet connection.");
      }
      if(!offlineQueued){
        if(!r.ok)throw new Error("Failed to save draft");
        const d=await r.json();
        EDITING_RESPONSE_ID=d.id; // keep the id so the next save updates the same row
        savedAt=d.submittedAt;
      }
    }else{
      const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/draft",{
        method:"POST",
        headers:pubHeaders({"Content-Type":"application/json"}),
        body:JSON.stringify({answers:ans,curPage})
      });
      if(!r.ok)throw new Error("Failed to save draft");
      const d=await r.json();
      savedAt=d.savedAt;
    }
    saveDraft(); // refresh the local draft too
    if(btn){btn.className="pv-savedraft saved";btn.textContent=offlineQueued?"⏳ Saved offline":"✓ Saved "+formatDraftTime(savedAt);setTimeout(()=>{if(btn){btn.className="pv-savedraft";btn.textContent="Save Draft";btn.disabled=false;}},3000);}
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Save Draft";}
    showNavError(e.message);
  }
}
