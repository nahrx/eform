/* ---- options ---- */
function getPath(o,p){return String(p).split(".").reduce((x,k)=>x==null?x:x[k],o);}
async function optionsFor(c,rp){
  rp=rp||"";
  if(c.optionsApi&&c.optionsApi.url){
    // Find the dependency value: roster-prefixed first, falling back to the page field
    const url=c.optionsApi.url.replace(/\{([^}]+)\}/g,(_,k)=>encodeURIComponent((rp?(answers[rp+k]??answers[k]):answers[k])??''));
    if(apiCache[url])return apiCache[url];
    try{const r=await fetch("/api/options-proxy?url="+encodeURIComponent(url));const d=await r.json();
      let arr=c.optionsApi.path?getPath(d,c.optionsApi.path):(Array.isArray(d)?d:(d.data||d.items||d.results||[]));
      const vf=c.optionsApi.valueField||"code",lf=c.optionsApi.labelField||"label";
      const opts=(arr||[]).map(it=>({value:it[vf],label:txt(it[lf])||String(it[vf])}));
      apiCache[url]=opts;return opts;
    }catch(e){return[];}
  }
  if(c.optionsRef){const t=(SCHEMA.referenceData||{})[c.optionsRef];
    if(!t||!t.items)return[];
    const parentVal=c.optionsFilterBy?refResolve(c.optionsFilterBy,rp):null;
    const items=(c.optionsFilterBy&&parentVal!=null&&parentVal!=="")
      ?t.items.filter(it=>String(it.parent)===String(parentVal))
      :t.items;
    return items.map(it=>({value:it.code,label:txt(it.label)}));}
  return(c.options||[]).map(o=>({value:o.value,label:txt(o.label)||String(o.value)}));
}

/* ---- field & node rendering ---- */
const NUMER=new Set(["number","integer","decimal","currency","range","rating"]);
const CHOICE=new Set(["select","multiselect","radio","checkbox"]);
const DATETIME=new Set(["date","time","datetime"]);
const DT_INPUT_TYPE={date:"date",time:"time",datetime:"datetime-local"};
let pending=[];

function pvEmpty(v){return v==null||v===""||(Array.isArray(v)&&v.length===0);}
/* A formula over answers that have not been given yet evaluates to NaN — ${a} + ${b}
   with both blank is undefined + undefined — and a division by zero gives Infinity.
   Neither is an answer, and neither may be recorded: an autofill field only recomputes
   while it is empty, so storing "NaN" once left it stuck there for the rest of the
   interview, and that string was submitted as the respondent's answer.
   Mirrors the same pair in builder.js. */
function calcUsable(r){return r!==undefined&&r!==""&&!(typeof r==="number"&&!Number.isFinite(r));}
/* Values only this code could have written, from before the guard above existed.
   Treated as "not answered yet" so a half-finished form repairs itself on the next
   render instead of carrying the bad value through to submission. */
function calcPoisoned(v){return v==="NaN"||v==="Infinity"||v==="-Infinity"||(typeof v==="number"&&!Number.isFinite(v));}
// Parse a geopoint value "lat, lng" (the format stored by the "Get Location" button) into {lat,lng} or null.
function parseGeoPoint(val){
  if(val==null||val==="")return null;
  const parts=String(val).split(",").map(s=>s.trim());
  if(parts.length!==2)return null;
  const lat=Number(parts[0]),lng=Number(parts[1]);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
  if(lat<-90||lat>90||lng<-180||lng>180)return null;
  return{lat,lng};
}
// Used by renderViewField (View Response mode) for photo/file/signature fields.
function getMediaSource(val){
  if(!val)return "";
  if(Array.isArray(val))return getMediaSource(val[0]);
  if(typeof val==="object")return getMediaSource(val.dataUrl||val.url||val.src||val.value||val.base64||"");
  const s=String(val);
  if(/^data:image\//i.test(s)||/^data:application\//i.test(s))return s;
  if(/^https?:\/\//i.test(s)||s.startsWith("/")||s.startsWith("blob:"))return s;
  return s.startsWith("base64,")?"data:image/*;base64,"+s.slice(7):"";
}
function isImageSrc(src){
  return /^data:image\//i.test(src)||/\.(jpe?g|png|gif|webp|bmp|svg)(\?.*)?$/i.test(src);
}
function fieldHtml(c,rp,scopes){
  rp=rp||"";
  const scopeList=[rp,...normScopes(scopes)];
  if(!evalVisible(c.visibleWhen,rp))return"";
  if(rp?ROW_SKIP_HIDDEN.get(rp.slice(0,-1))?.has(c.name):SKIP_HIDDEN.has(c.name))return""; // hidden by skip-to
  const key=rp+c.name, ke=esc(key);
  if(c.type==="note")    return`<div class="pv-note pv-field">${sanitizeHtml(txt(c.html)||"")}</div>`;
  if(c.type==="markdown")return`<div class="pv-note pv-field pv-md">${mdToHtml(txt(c.markdown))}</div>`;
  if(c.type==="hidden")  return"";
  const isRequired=!!c.required||!!(c.requiredWhen&&evalVisible(c.requiredWhen,rp));
  const enabled=evalVisible(c.enableWhen,rp);
  const dis=enabled?"":" disabled";
  const rdOnly=c.readOnly?" readonly":"";
  const disAll=(enabled&&!c.readOnly)?"":" disabled";
  const lab=`<label class="pv-lab">${esc(rowInterp(txt(c.label)||c.name,scopeList))}${isRequired?' <span class="pv-req">*</span>':''}</label>`;
  const hint=c.hint?`<div class="pv-hint">${esc(rowInterp(txt(c.hint),scopeList))}</div>`:"";
  if(c.defaultValue&&pvEmpty(answers[key]))answers[key]=c.defaultValue;
  if(c.type==="calculated"){
    if(c.autofill){
      if(pvEmpty(answers[key])||calcPoisoned(answers[key])){
        const r=evalExprSrc(c.calculate,rp);
        if(calcUsable(r))answers[key]=String(r);
        else delete answers[key];   // leave it unanswered rather than record a non-number
      }
      const autoVal=answers[key]??"";
      return`<div class="pv-field" data-fieldkey="${ke}">${lab}${hint}<div><input type="text" data-k="${ke}" class="pv-in" value="${esc(autoVal)}"${dis}></div></div>`;
    }
    const r=evalExprSrc(c.calculate,rp);
    const ok=calcUsable(r);
    answers[key]=ok?r:"";
    return`<div class="pv-field" data-fieldkey="${ke}">${lab}${hint}<div><input class="pv-in" value="${esc(ok?String(r):"—")}" disabled></div></div>`;
  }
  const val=answers[key];
  let ctrl="";
  if(c.type==="textarea")
    ctrl=`<textarea data-k="${ke}" class="pv-in" rows="3"${dis}${rdOnly}></textarea>`;
  else if(c.type==="email")
    ctrl=`<input type="email" data-k="${ke}" class="pv-in" placeholder="${esc(c.placeholder||"name@domain.com")}"${dis}${rdOnly}>`;
  else if(NUMER.has(c.type))
    ctrl=`<input type="number" data-k="${ke}" class="pv-in" style="width:auto;min-width:160px"${c.min!=null&&c.min!==""?` min="${esc(String(c.min))}"` :""}${c.max!=null&&c.max!==""?` max="${esc(String(c.max))}"`:""}${dis}${rdOnly}>` +(c.unit?`<span class="pv-unit">${esc(c.unit)}</span>`:"");
  else if(DATETIME.has(c.type))
    ctrl=`<input type="${DT_INPUT_TYPE[c.type]}" data-k="${ke}" class="pv-in" style="width:auto"${c.min!=null&&c.min!==""?` min="${esc(String(c.min))}"`:""}${c.max!=null&&c.max!==""?` max="${esc(String(c.max))}"`:""}${dis}${rdOnly}>`;
  else if(c.type==="boolean")
    ctrl=`<div class="pv-radios"><label class="pv-opt"><input type="radio" name="r_${ke}" data-kr="${ke}" value="true"${disAll}> Yes</label><label class="pv-opt"><input type="radio" name="r_${ke}" data-kr="${ke}" value="false"${disAll}> No</label></div>`;
  else if(CHOICE.has(c.type)){
    ctrl=`<div class="pv-radios" id="opt-${ke}"><div class="pv-loading">Loading options…</div></div>`;
    pending.push({c,rp,enabled:enabled&&!c.readOnly});
  }
  else if(c.type==="geopoint"){
    const g=parseGeoPoint(val);
    const geoMap=g?`<div class="geo-map" data-lat="${g.lat}" data-lng="${g.lng}"></div>`:"";
    ctrl=`<div class="pv-inbtn"><input type="text" data-k="${ke}" class="pv-in" placeholder="lat, lng"${dis}${rdOnly}><button type="button" class="pv-smbtn pv-geobtn"${disAll}>📍 Get Location</button></div><div class="pv-geomsg"></div>${geoMap}`;
  }
  else if(c.type==="barcode")
    ctrl=`<div class="pv-inbtn"><input type="text" data-k="${ke}" class="pv-in" placeholder="scan / type the code"${dis}${rdOnly}><button type="button" class="pv-smbtn pv-scanbtn"${disAll}>📷 Scan</button></div>`;
  else if(c.type==="signature")
    ctrl=`<div class="pv-sigwrap"><input type="hidden" data-k="${ke}" value="${esc(val)}"><canvas class="pv-sigpad" width="400" height="140"${(enabled&&!c.readOnly)?"":' data-disabled="1"'}></canvas><div class="pv-sigactions"><button type="button" class="pv-smbtn pv-sigsave"${disAll} disabled>Save signature</button><button type="button" class="pv-smbtn pv-sigclear"${disAll}>Clear signature</button><span class="pv-sigmsg"></span></div></div>`;
  else if(c.type==="photo"||c.type==="file"){
    const isPhoto=c.type==="photo";
    const disClass=(!enabled||c.readOnly)?' pv-photolabel-dis':'';
    const dis2=(!enabled||c.readOnly)?' disabled':'';
    ctrl=`<div class="pv-photowrap" data-field-type="${isPhoto?'photo':'file'}" data-max-kb="${isPhoto?photoMaxKB(c):0}"><input type="hidden" data-k="${ke}" value="${esc(val)}"><div class="pv-photorow"><label class="pv-photolabel${disClass}"><input type="file" class="pv-photofile"${isPhoto?' accept="image/*" capture="environment"':''}${dis2}>${isPhoto?'📷 Take / Choose Photo':'📎 Choose File'}</label><button type="button" class="pv-smbtn pv-photoupload"${dis2} disabled>Upload</button></div><div class="pv-photostate"></div><div class="pv-photopreview" hidden></div></div>`;
  }
  else
    ctrl=`<input type="text" data-k="${ke}" class="pv-in" placeholder="${esc(c.placeholder||"")}"${dis}${rdOnly}>`;
  let vmsg="";
  if(!pvEmpty(val)){
    (c.validations||[]).forEach(v=>{
      if(!v.test)return;
      const r=evalExprSrc(v.test,rp);
      if(r===undefined)return;
      if(!r)vmsg+=`<div class="pv-vmsg ${v.severity==="warning"?"warning":"error"}">${esc(txt(v.message)||"Invalid value")}</div>`;
    });
  }
  return`<div class="pv-field" data-fieldkey="${ke}">${lab}${hint}<div>${ctrl}</div>${vmsg}</div>`;
}

function nodeHtml(c,rp,scopes){
  rp=rp||"";
  const scopeList=[rp,...normScopes(scopes)];
  if(c.kind==="block"){
    if(!evalVisible(c.visibleWhen,rp))return"";
    const inner=(c.components||[]).map(x=>nodeHtml(x,rp,scopes)).join("");
    if(!inner)return"";
    return`<div class="pv-card">${c.title?`<div class="pv-bt">${esc(rowInterp(txt(c.title),scopeList))}</div>`:""}${inner}</div>`;
  }
  if(c.kind==="section"){
    if(!evalVisible(c.visibleWhen,rp))return"";
    const inner=(c.components||[]).map(x=>nodeHtml(x,rp,scopes)).join("");
    if(!inner)return"";
    return`<div class="pv-sec">${c.title?`<div class="pv-st">${esc(rowInterp(txt(c.title),scopeList))}</div>`:""}${inner}</div>`;
  }
  if(c.kind==="roster"){
    if(!evalVisible(c.visibleWhen,rp))return"";
    return rosterHtml(c,rp,scopes);
  }
  return fieldHtml(c,rp,scopes);
}

/* ---- roster ---- */
/* An absolute ceiling on rows, whatever the answers say. Max on the roster is
   optional, so without this the row count was whatever number happened to be in the
   source field: pointing countFrom at a code field by mistake (a village code reads
   6472010) asked the browser to build millions of rows. Measured on a desktop, 2,000
   rows already cost 32,000 DOM nodes and half a second per render, and the render
   repeats on every answer — on the phones enumerators actually carry, a slip like that
   ends the interview. */
const ROSTER_MAX_ROWS=500;
function rosterCountRaw(r,rowPrefix){
  const from=String(r.countFrom||"").trim();
  if(from){
    let raw=refResolve(from,rowPrefix||"");
    if((raw==null||raw==="")&&rosterView&&rosterView.roster){
      const k=`${rosterView.roster.name}#${rosterView.rowIdx}#${from}`;
      if(k in answers)raw=answers[k];
    }
    let cf=Math.floor(Number(raw));
    if(!Number.isFinite(cf)||cf<0)cf=0;
    if(r.max!=null&&r.max!==""&&cf>Number(r.max))cf=Number(r.max);
    return cf;
  }
  const stored=answers[rosterCountKey(r,rowPrefix)];
  if(stored!=null)return Math.max(0,Math.floor(Number(stored))||0);
  return Number(r.min)||0;
}
function rosterCount(r,rowPrefix){return Math.min(rosterCountRaw(r,rowPrefix),ROSTER_MAX_ROWS);}
/* Clamping silently would leave the enumerator wondering where the rows went, so the
   roster says so where it happened. */
function rosterCapNotice(r,rowPrefix){
  const raw=rosterCountRaw(r,rowPrefix);
  if(raw<=ROSTER_MAX_ROWS)return "";
  return `<div class="pv-rowempty" style="border-left:3px solid #f59e0b;background:#fffbeb;color:#78350f">Showing the first ${ROSTER_MAX_ROWS} of ${raw} rows. Check the answer that sets the row count — a number this large is usually a typo.</div>`;
}
function rosterScopePrefix(r,rowPrefix){return `${rowPrefix||""}${r.name}#`;}
function rosterCountKey(r,rowPrefix){return `${rosterScopePrefix(r,rowPrefix)}count`;}
function rosterRowPrefix(r,rowIdx,rowPrefix){return `${rosterScopePrefix(r,rowPrefix)}${rowIdx}#`;}
function flatRosterFields(r){const out=[];function go(a){(a||[]).forEach(c=>{c.kind==="field"?out.push(c):c.components&&go(c.components);});}go(r.components);return out;}
function rowSummary(r,i,rowPrefix){
  const fields=(r.rowDisplay&&r.rowDisplay.length)?r.rowDisplay:flatRosterFields(r).slice(0,2).map(c=>c.name);
  const rp=rosterRowPrefix(r,i,rowPrefix);
  return fields.map(fn=>{const v=answers[`${rp}${fn}`];return(v==null||v==="")?null:String(v);}).filter(Boolean).join(" · ");
}
function hasRowData(r,i,rowPrefix){const rp=rosterRowPrefix(r,i,rowPrefix);return flatRosterFields(r).some(c=>{const v=answers[`${rp}${c.name}`];return v!=null&&v!==""&&!(Array.isArray(v)&&!v.length);});}
function addRowLabel(r){return r.rowTitle?`+ Add ${esc(txt(r.rowTitle))}`:"+ Add row";}
function rosterMax(r){
  if(r.max==null||r.max==="")return null;
  const mx=Math.floor(Number(r.max));
  return Number.isFinite(mx)&&mx>=0?mx:null;
}
function rosterAtMax(r,rowPrefix){
  const mx=rosterMax(r);
  return mx!=null&&rosterCount(r,rowPrefix)>=mx;
}
// Interpolate other fields from the same roster row into label/hint/itemLabel text.
// Supports two syntaxes: {{name}} and ${name} (both are used in various places).
const INTERP_RE=/\{\{\s*([^}]+?)\s*\}\}|\$\{\s*([^}]+?)\s*\}/g;
function normScopes(scopes){
  if(!scopes)return [];
  if(Array.isArray(scopes))return scopes.filter(Boolean);
  return [scopes].filter(Boolean);
}
function indexFromScopePrefix(prefix){
  const m=String(prefix||"").match(/#(\d+)#$/);
  return m?Number(m[1])+1:null;
}
function rowInterp(text,scopes){
  if(!text)return text;
  const list=normScopes(scopes);
  return text.replace(INTERP_RE,(_,a,b)=>{
    const n=(a||b).trim();
    if(n==="index"){
      for(const p of list){const idx=indexFromScopePrefix(p);if(idx!=null)return String(idx);}
      return "";
    }
    for(const p of list){const k=p+n;if(k in answers)return String(answers[k]);}
    return "";
  });
}
function rowLabel(r,i,scopes){
  if(r.itemLabel){const rp=`${r.name}#${i}#`;const list=[rp,...normScopes(scopes)];return esc(txt(r.itemLabel).replace(/\{\{\s*index\s*\}\}|\$\{\s*index\s*\}/g,String(i+1)).replace(INTERP_RE,(_,a,b)=>{const n=(a||b).trim();for(const p of list){const k=p+n;if(k in answers)return String(answers[k]);}return "";}));}
  return r.rowTitle?`${esc(txt(r.rowTitle))} #${i+1}`:`Row #${i+1}`;
}
function rowDefaultValue(r,i){
  const raw=String(txt(r.rowDefaults)||"");
  if(!raw)return "";
  const lines=raw.split(/\r?\n/).map(s=>s.trim());
  return (i<lines.length&&lines[i])?lines[i]:"";
}
function ensureRosterDefaultValues(r,count,rowPrefix){
  const pf=primaryRowField(r);
  if(!pf) return;
  for(let i=0;i<count;i++){
    const key=`${rosterRowPrefix(r,i,rowPrefix)}${pf}`;
    const cur=answers[key];
    if(cur!=null&&String(cur)!=="") continue;
    const def=rowDefaultValue(r,i);
    if(def) answers[key]=def;
  }
}
function rosterHtml(r,rp,scopes){
  rp=rp||"";
  const hostScopes=[rp,...normScopes(scopes)];
  const from=String(r.countFrom||"").trim();
  const count=rosterCount(r,rp),manual=!from,rn=esc(r.name);
  /* The row buttons have to carry the prefix of the row this roster sits in, not just
     its name: a roster nested inside another (Roster → Section → Roster, which the
     builder allows) stores its answers under "art#0#usaha#…". Sending the bare name
     made every nested roster's buttons identical across the outer rows, and the delete
     matched no keys at all — it removed nothing and left an orphan "usaha#count". */
  const hostRp=esc(rp);
  const canAdd=manual&&!rosterAtMax(r,rp);
  ensureRosterDefaultValues(r,count,rp);
  const title=esc(rowInterp(txt(r.title)||r.name,hostScopes));
  if(r.rosterType==="separate"){
    let h=`<div class="pv-roster" id="pvroster_${rn}"><div class="pv-rh">${title}<span class="pv-tag">subhalaman</span></div>`;
    if(from&&count<=0)h+=`<div class="pv-rowempty">Fill in the "${esc(from)}" field first to determine the number of rows.</div>`;
    else if(count<=0)h+=`<div class="pv-rowempty">No rows yet.</div>`;
    else{h+=`<div class="pv-rowlist">`;for(let i=0;i<count;i++){const sum=rowSummary(r,i,rp),filled=hasRowData(r,i,rp);h+=`<div class="pv-rowitem"><div class="pv-rowinfo"><b>${rowLabel(r,i,hostScopes)}</b><span>${sum?esc(sum):"<i>not filled in</i>"}</span></div>${manual?`<button class="pv-rowdel" data-delrow="${rn}" data-rp="${hostRp}" data-i="${i}">remove</button>`:""}<button class="pv-rowopen" data-openrow="${rn}" data-rp="${hostRp}" data-i="${i}">${filled?"Edit":"Fill"} →</button></div>`;}h+=`</div>`;}
    if(canAdd)h+=`<button class="pv-add" data-addrow="${rn}" data-rp="${hostRp}">${addRowLabel(r)}</button>`;
    return h+`</div>`;
  }
  let h=`<div class="pv-roster" id="pvroster_${rn}"><div class="pv-rh">${title}</div>`;
  if(from&&count<=0)h+=`<div class="pv-rowempty">Fill in the "${esc(from)}" field first to determine the number of rows.</div>`;
  h+=rosterCapNotice(r,rp);
  for(let i=0;i<count;i++){const childRp=rosterRowPrefix(r,i,rp);const rowKey=childRp.slice(0,-1);const rowSkip=computeRosterRowSkipState(r,i);ROW_SKIP_HIDDEN.set(rowKey,rowSkip);rowSkip.forEach(n=>{delete answers[`${childRp}${n}`];});h+=`<div class="pv-row"><div class="pv-rownum"><span>${rowLabel(r,i,hostScopes)}</span>${manual?`<button class="pv-del" data-delrow="${rn}" data-rp="${hostRp}" data-i="${i}">remove</button>`:""}</div>`;(r.components||[]).forEach(f=>h+=nodeHtml(f,childRp,hostScopes));h+=`</div>`;}
  if(canAdd)h+=`<button class="pv-add" data-addrow="${rn}" data-rp="${hostRp}">${addRowLabel(r)}</button>`;
  return h+`</div>`;
}
function primaryRowField(r){if(r.rowDisplay&&r.rowDisplay.length)return r.rowDisplay[0];const f=flatRosterFields(r)[0];return f?f.name:null;}
function openAddRowModal(roster,hostRp){
  saveAnswers();
  const title=txt(roster.rowTitle)||"row";
  const promptFields=flatRosterFields(roster).filter(f=>f.promptOnAdd);
  const bg=document.createElement("div");bg.className="pv-modal-bg";
  const fieldsHtml=promptFields.length
    ?promptFields.map(f=>`<div style="margin-bottom:10px"><label style="display:block;font-size:12.5px;font-weight:500;margin-bottom:5px">${esc(txt(f.label)||f.name)}</label><input class="pv-modal-in" data-pf="${esc(f.name)}" placeholder="${esc(txt(f.placeholder)||txt(f.label)||f.name)}…" style="width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 10px;font-size:13px;box-sizing:border-box"></div>`).join("")
    :`<input type="text" id="addRowInput" placeholder="${esc(title)}…">`;
  bg.innerHTML=`<div class="pv-modal"><h3>Add ${esc(title)}</h3>${fieldsHtml}<div class="pv-modal-actions"><button class="btn ghost" id="addRowCancel">Cancel</button><button class="btn primary" id="addRowConfirm">+ Add ${esc(title)}</button></div></div>`;
  document.body.appendChild(bg);
  const firstInput=bg.querySelector("input");if(firstInput)firstInput.focus();
  const close=()=>bg.remove();
  bg.querySelector("#addRowCancel").addEventListener("click",close);
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  const confirmAdd=()=>{
    const scope=rosterScopePrefix(roster,hostRp||"");   // "" or "art#0#" + name + "#"
    const mx=rosterMax(roster);
    const idx=rosterCount(roster,hostRp||"");
    if(mx!=null&&idx>=mx){
      alert(`Maximum ${mx} rows.`);
      close();
      renderCurrentPage();
      return;
    }
    if(idx>=ROSTER_MAX_ROWS){
      alert(`This form allows at most ${ROSTER_MAX_ROWS} rows here.`);
      close();
      renderCurrentPage();
      return;
    }
    answers[`${scope}count`]=idx+1;
    if(promptFields.length){
      bg.querySelectorAll("[data-pf]").forEach(el=>{const v=el.value.trim();if(v)answers[`${scope}${idx}#${el.dataset.pf}`]=v;});
    }else{
      const val=bg.querySelector("#addRowInput")?.value.trim();
      if(val){const pf=primaryRowField(roster);if(pf)answers[`${scope}${idx}#${pf}`]=val;}
    }
    close();renderCurrentPage();
    setTimeout(()=>{const el=document.getElementById("pvroster_"+roster.name);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});},20);
  };
  bg.querySelector("#addRowConfirm").addEventListener("click",confirmAdd);
  bg.querySelectorAll("input").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();confirmAdd();}if(e.key==="Escape")close();}));
}
function findRoster(rname){function search(comps){for(const c of comps){if(c.kind==="roster"&&c.name===rname)return c;if(c.components){const f=search(c.components);if(f)return f;}}return null;}for(const p of PAGES){const f=search(p.components||[]);if(f)return f;}return null;}
/* Used by refResolve to tell a dotted dataKey ("3.12") apart from roster.field
   notation. Answered from the schema, and memoised because refResolve runs for every
   expression on every render. */
const _fieldByName=new Map();
function findFieldNamed(fname){
  if(_fieldByName.has(fname))return _fieldByName.get(fname);
  let hit=null;
  (function search(comps){for(const c of comps){if(hit)return;
    if(c.kind!=="roster"&&c.kind!=="page"&&c.kind!=="block"&&c.kind!=="section"&&c.name===fname){hit=c;return;}
    if(c.components)search(c.components);}})(PAGES.flatMap(p=>p.components||[]));
  _fieldByName.set(fname,hit);
  return hit;
}
/* hostRp is the prefix of the row this roster sits in — "" at the top level, or
   "art#0#" for a roster nested inside another. Everything below keys off the roster's
   full scope, so a nested roster deletes its own rows rather than nothing at all. */
function deleteRow(rname,hostRp,idx){
  const roster=findRoster(rname);if(!roster)return;
  const prefix=rosterScopePrefix(roster,hostRp||"");   // e.g. "art#0#usaha#"
  const countKey=prefix+"count";
  const count=rosterCount(roster,hostRp||"");
  const nv={};
  Object.keys(answers).forEach(k=>{
    if(k===countKey)return;
    if(k.startsWith(prefix)){const m=k.slice(prefix.length).match(/^(\d+)#(.*)$/);if(m){let ri=+m[1];const fn=m[2];if(ri===idx)return;if(ri>idx)ri--;nv[`${prefix}${ri}#${fn}`]=answers[k];return;}}
    nv[k]=answers[k];
  });
  nv[countKey]=Math.max(0,count-1);answers=nv;
}

/* ---- page visibility & navigation ---- */
function isPageVisible(i){return i>=0&&i<PAGES.length&&evalVisible(PAGES[i].visibleWhen,"");}
function visiblePageIdx(){return PAGES.map((_,i)=>i).filter(isPageVisible);}
function nextVisibleIndex(from){for(let i=from+1;i<PAGES.length;i++)if(isPageVisible(i))return i;return -1;}
function prevVisibleIndex(from){for(let i=from-1;i>=0;i--)if(isPageVisible(i))return i;return -1;}
function nearestVisibleIndex(idx){if(isPageVisible(idx))return idx;const f=nextVisibleIndex(idx-1);if(f!==-1)return f;const b=prevVisibleIndex(idx+1);return b!==-1?b:idx;}

/* ---- skip-to ---- */
function nodeContainsName(node,target){if(node.name===target)return true;return (node.components||[]).some(c=>nodeContainsName(c,target));}
function pageIndexOfTarget(target){
  if(!target)return null;
  if(target==="__next")return null;
  if(target==="__prev"){const p=prevVisibleIndex(curPage);return p!==-1?p:null;}
  if(target==="__end"){const vis=visiblePageIdx();return vis.length?vis[vis.length-1]:PAGES.length-1;}
  for(let i=0;i<PAGES.length;i++){if(nodeContainsName(PAGES[i],target))return nearestVisibleIndex(i);}
  return null;
}
function fieldSkipTarget(f){
  for(const s of (f.skips||[])){
    if(!s.when||!s.to)continue;
    const r=evalExprSrc(s.when,"");
    if(r===undefined)continue;
    if(r)return s.to;
  }
  if(CHOICE.has(f.type)&&Array.isArray(f.options)){
    const v=answers[f.name];
    const sel=Array.isArray(v)?v.map(String):[String(v)];
    for(const o of f.options){if(o.skipTo&&sel.includes(String(o.value)))return o.skipTo;}
  }
  return null;
}
// The first skip target registered on this field (used as the default
// when the field has not been answered at all — see fieldEffectiveSkipTarget).
function fieldPendingTarget(f){
  const s=(f.skips||[]).find(x=>x.when&&x.to);
  if(s)return s.to;
  if(CHOICE.has(f.type)&&Array.isArray(f.options)){
    const o=f.options.find(o=>o.skipTo);
    if(o)return o.skipTo;
  }
  return null;
}
// A field that can skip but has NOT been answered yet counts as "pending":
// by default the fields between it and the target stay hidden until
// answered with an option that does NOT trigger a skip (only then does the normal path open).
function fieldEffectiveSkipTarget(f){
  const t=fieldSkipTarget(f);
  if(t)return t;
  if(pvEmpty(answers[f.name]))return fieldPendingTarget(f);
  return null;
}
// Roster variant: evaluate the skip using one specific row's answers (rp = "roster#idx#").
function fieldSkipTargetRp(f,rp){
  for(const s of (f.skips||[])){
    if(!s.when||!s.to)continue;
    const r=evalExprSrc(s.when,rp);
    if(r===undefined)continue;
    if(r)return s.to;
  }
  if(CHOICE.has(f.type)&&Array.isArray(f.options)){
    const v=answers[rp+f.name];
    const sel=Array.isArray(v)?v.map(String):[String(v)];
    for(const o of f.options){if(o.skipTo&&sel.includes(String(o.value)))return o.skipTo;}
  }
  return null;
}
function fieldEffectiveSkipTargetRp(f,rp){
  const t=fieldSkipTargetRp(f,rp);
  if(t)return t;
  if(pvEmpty(answers[rp+f.name]))return fieldPendingTarget(f);
  return null;
}
// Work out which fields in one roster row must be hidden because of a skip-to.
// The "__end" target means finish the rest of this row (later fields in the same
// row are hidden; other roster rows are unaffected).
function computeRosterRowSkipState(roster,rowIdx){
  const rp=`${roster.name}#${rowIdx}#`;
  const allRowFields=flatRosterFields(roster);
  const allNames=new Set(allRowFields.map(f=>f.name));
  const hidden=new Set();
  let skipActive=false,skipTarget=null;
  for(const f of allRowFields){
    if(skipActive){
      if(skipTarget&&f.name===skipTarget){skipActive=false;skipTarget=null;}
      else{hidden.add(f.name);continue;}
    }
    const t=fieldEffectiveSkipTargetRp(f,rp);
    if(t==="__end"){skipActive=true;skipTarget=null;}
    else if(t&&allNames.has(t)&&t!==f.name){skipActive=true;skipTarget=t;}
  }
  return hidden;
}
// Work out which fields on this page must be hidden because a skip is currently
// active (its target is on the same page), plus the target page when the active
// skip has not "finished" by the end of this page.
function computePageSkipState(page){
  const hidden=new Set();
  const fields=[];
  (function walk(n,prefix){(n.components||[]).forEach(c=>{if(c.kind==="field")fields.push(c);else if(c.kind!=="roster")walk(c,prefix);});})(page,"");
  let skipActive=false,skipTarget=null,crossPageTarget=null;
  for(const f of fields){
    if(skipActive){
      if(f.name===skipTarget){skipActive=false;skipTarget=null;}
      else{hidden.add(f.name);continue;}
    }
    const t=fieldEffectiveSkipTarget(f);
    if(t&&t!=="__next"){
      if(nodeContainsName(page,t)&&t!==f.name){skipActive=true;skipTarget=t;}
      else{skipActive=true;skipTarget=null;crossPageTarget=t;}
    }
  }
  return{hidden,crossPageTarget:skipActive?crossPageTarget:null};
}
let SKIP_HIDDEN=new Set();
let ROW_SKIP_HIDDEN=new Map();
function clearPageAnswers(pageIdx){
  const page=PAGES[pageIdx];if(!page)return;
  (function walk(n,prefix){(n.components||[]).forEach(c=>{
    if(c.kind==="field"){delete answers[prefix+c.name];}
    else if(c.kind==="roster"){
      const cnt=Math.max(rosterCount(c),Number(answers[`${c.name}#count`])||0);
      for(let i=0;i<cnt;i++){(c.components||[]).forEach(f=>{delete answers[`${c.name}#${i}#${f.name}`];});}
      delete answers[`${c.name}#count`];
    }else{walk(c,prefix);}
  });})(page,"");
}
function clearSkippedAnswers(fromIdx,toIdx){if(toIdx<=fromIdx+1)return;for(let i=fromIdx+1;i<toIdx;i++)clearPageAnswers(i);}

/* ---- validation before continuing/submitting ---- */
function walkRosterComps(comps,rp,rowSkip,out){
  (comps||[]).forEach(c=>{
    if(!evalVisible(c.visibleWhen,rp))return;
    if(c.kind==="field"){
      if(!rowSkip.has(c.name))out.push({c,rp});
      return;
    }
    if(c.kind==="roster"){
      const cnt=rosterCount(c,rp);
      for(let i=0;i<cnt;i++){
        const childRp=rosterRowPrefix(c,i,rp);
        const childSkipKey=childRp.slice(0,-1);
        const childSkip=ROW_SKIP_HIDDEN.has(childSkipKey)?ROW_SKIP_HIDDEN.get(childSkipKey):computeRosterRowSkipState(c,i);
        walkRosterComps(c.components||[],childRp,childSkip,out);
      }
      return;
    }
    if(c.components)walkRosterComps(c.components,rp,rowSkip,out);
  });
}
function pageValidationTargets(page){
  const out=[];
  (function walk(n,prefix){(n.components||[]).forEach(c=>{
    if(!evalVisible(c.visibleWhen,prefix))return;
    if(c.kind==="field"){if(!SKIP_HIDDEN.has(c.name))out.push({c,rp:prefix});}
    else if(c.kind==="roster"){
      const cnt=rosterCount(c,prefix);
      for(let i=0;i<cnt;i++){
        const rp2=rosterRowPrefix(c,i,prefix);
        const rowSkipKey=rp2.slice(0,-1);
        const rowSkip=ROW_SKIP_HIDDEN.has(rowSkipKey)?ROW_SKIP_HIDDEN.get(rowSkipKey):computeRosterRowSkipState(c,i);
        walkRosterComps(c.components||[],rp2,rowSkip,out);
      }
    }else{walk(c,prefix);}
  });})(page,"");
  return out;
}
function validateCurrentPage(){
  saveAnswers();
  const targets=pageValidationTargets(PAGES[curPage]);
  for(const {c,rp} of targets){
    if(c.type==="note"||c.type==="markdown"||c.type==="hidden"||(c.type==="calculated"&&!c.autofill))continue;
    if(!evalVisible(c.enableWhen,rp))continue;
    const key=rp+c.name,val=answers[key];
    const isRequired=!!c.required||!!(c.requiredWhen&&evalVisible(c.requiredWhen,rp));
    if(isRequired&&pvEmpty(val))return{ok:false,key};
    if(!pvEmpty(val)){
      for(const v of (c.validations||[])){
        if(!v.test||v.severity==="warning")continue;
        const r=evalExprSrc(v.test,rp);
        if(r===undefined)continue;
        if(!r)return{ok:false,key};
      }
    }
  }
  let rosterGate=null;
  (function walkR(comps,pfx){if(rosterGate)return;(comps||[]).forEach(c=>{if(rosterGate||!evalVisible(c.visibleWhen,pfx))return;if(c.kind==="roster"){if(c.requiredRows&&rosterCount(c,pfx)===0)rosterGate={ok:false,key:"pvroster_"+c.name};}else if(c.kind!=="field"&&c.components)walkR(c.components,pfx);});})(PAGES[curPage].components||[],"");
  if(rosterGate)return rosterGate;
  return{ok:true,key:null};
}
function focusField(key){
  const el=document.querySelector(`[data-fieldkey="${CSS.escape(key)}"]`);
  if(el){el.classList.add("pv-field-err");el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.classList.remove("pv-field-err"),2500);return;}
  const byId=document.getElementById(key);
  if(byId){byId.classList.add("pv-roster-err");byId.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>byId.classList.remove("pv-roster-err"),2500);}
}

/* ---- collect every error across all pages ---- */
function collectAllErrors(){
  saveAnswers();
  const errors=[];
  for(let pi=0;pi<PAGES.length;pi++){
    const page=PAGES[pi];
    if(!evalVisible(page.visibleWhen,""))continue;
    const saved=SKIP_HIDDEN;
    SKIP_HIDDEN=computePageSkipState(page).hidden;
    const targets=pageValidationTargets(page);
    SKIP_HIDDEN=saved;
    for(const {c,rp} of targets){
      if(c.type==="note"||c.type==="markdown"||c.type==="hidden"||(c.type==="calculated"&&!c.autofill))continue;
      if(!evalVisible(c.enableWhen,rp))continue;
      const key=rp+c.name,val=answers[key];
      const isRequired=!!c.required||!!(c.requiredWhen&&evalVisible(c.requiredWhen,rp));
      if(isRequired&&pvEmpty(val)){errors.push({pageIdx:pi,key,label:txt(c.label)||c.name,rp,msg:""});continue;}
      if(!pvEmpty(val)){
        for(const v of (c.validations||[])){
          if(!v.test||v.severity==="warning")continue;
          const r=evalExprSrc(v.test,rp);
          if(r===undefined)continue;
          if(!r){errors.push({pageIdx:pi,key,label:txt(c.label)||c.name,rp,msg:txt(v.message)||""});break;}
        }
      }
    }
    (function walkR(comps,pfx){(comps||[]).forEach(c=>{if(!evalVisible(c.visibleWhen,pfx))return;if(c.kind==="roster"){if(c.requiredRows&&rosterCount(c,pfx)===0)errors.push({pageIdx:pi,key:"pvroster_"+c.name,label:txt(c.title)||c.name,rp:"",msg:"No rows have been added yet"});}else if(c.kind!=="field"&&c.components)walkR(c.components,pfx);});})(page.components||[],"");
  }
  return errors;
}

/* ---- show the error summary before submitting ---- */
function showErrorSummary(errors){
  const pvBody=document.getElementById("pvBody");
  const navArea=document.getElementById("pvNavArea");
  if(!pvBody)return;
  const vis=visiblePageIdx();
  let rows="";
  errors.forEach(err=>{
    const p=PAGES[err.pageIdx];
    const pTitle=txt(p.title)||p.name||`Page ${err.pageIdx+1}`;
    const visPos=vis.indexOf(err.pageIdx);
    const pageLbl=visPos>=0?`Hal. ${visPos+1} — ${esc(pTitle)}`:esc(pTitle);
    const roster=err.rp?err.rp.match(/^([^#]+)#(\d+)#/):null;
    const ctxLbl=roster?`${esc(roster[1])} (Row ${+roster[2]+1}) · ${esc(err.label)}`:esc(err.label);
    const msgLbl=err.msg?esc(err.msg):"Required field not filled in";
    rows+=`<div class="pv-err-item">
      <div class="pv-err-info">
        <span class="pv-err-page">${pageLbl}</span>
        <span class="pv-err-lbl">${ctxLbl}</span>
        <span class="pv-err-msg">${msgLbl}</span>
      </div>
      <button class="pv-err-fix" data-ep="${err.pageIdx}" data-ek="${esc(err.key)}">Perbaiki →</button>
    </div>`;
  });
  pvBody.innerHTML=`<div class="pv-page">
    <div class="pv-err-head">
      <div class="pv-err-icon">⚠</div>
      <h2 class="pv-h2" style="margin-bottom:6px">${errors.length} entries still need completing</h2>
      <p class="pv-err-sub">Please complete every highlighted field before submitting.</p>
    </div>
    <div class="pv-err-list">${rows}</div>
  </div><div class="foot">eForm · {{ORG_NAME}}</div>`;
  if(navArea)navArea.innerHTML=`<div class="pv-nav"><button class="btn" id="pvErrBack">← Back to the last page</button><span></span><span></span></div>`;
  document.getElementById("pvErrBack")?.addEventListener("click",()=>goToPage(curPage));
  document.querySelectorAll(".pv-err-fix").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=+btn.dataset.ep,k=btn.dataset.ek;
      const rosterMatch=k.match(/^([^#]+)#(\d+)#/);
      if(rosterMatch){
        goToPage(pi);
        setTimeout(()=>{openRosterRow(rosterMatch[1],+rosterMatch[2]);setTimeout(()=>focusField(k),80);},80);
      }else{
        goToPage(pi);
        setTimeout(()=>focusField(k),80);
      }
    });
  });
}

function setupSidebarToggle(side){

function goToPage(idx){

function separateRostersInPage(p){
  const out=[];
  (function go(comps){(comps||[]).forEach(c=>{
    if(c.kind==="roster"&&c.rosterType==="separate")out.push(c);
    if(c.components)go(c.components);

/* Keep the just-answered element in place in the viewport even as the content changes */
function snapScroll(fkey,top0){
  if(!fkey||top0==null)return;
  const pvBody=document.getElementById("pvBody");if(!pvBody)return;
  const nf=pvBody.querySelector(`.pv-field[data-fieldkey="${CSS.escape(fkey)}"]`);
  if(!nf)return;
  const delta=Math.round(nf.getBoundingClientRect().top-top0);
  if(!delta)return;
  pvBody.scrollTop+=delta;
  // Fallback: if scroll was clamped (content shrank due to skip-to), center the field
  if(Math.abs(Math.round(nf.getBoundingClientRect().top-top0))>4)nf.scrollIntoView({block:"center"});
}
function renderSidebar(){

function renderCurrentPage(){

    const targets=[];
    walkRosterComps(roster.components||[],rp,rowSkip,targets);
    for(const {c,rp:keyRp} of targets){
      if(c.type==="note"||c.type==="markdown"||c.type==="hidden"||(c.type==="calculated"&&!c.autofill))continue;
      if(!evalVisible(c.enableWhen,keyRp))continue;
      const key=keyRp+c.name;

            return;
          }
        }
      }

  };

  (PAGES[curPage]?.components||[]).forEach(function walk(c){if(c.kind==="roster"&&c.countFrom)cfFields.add(c.countFrom);(c.components||[]).forEach(walk);});
  // Live re-render when a field changes. After rendering, restore focus to the

  const rerenderPage=(e)=>{

/* ---- widget field khusus: tanda tangan, lokasi, pindai barcode ---- */

function wireSignaturePad(canvas){
  if(canvas._wired)return;canvas._wired=true;
  const hidden=canvas.previousElementSibling; // <input type="hidden" data-k="...">
  if(!hidden)return;
  const wrap=canvas.parentElement;
  const saveBtn=wrap.querySelector(".pv-sigsave");
  const clearBtn=wrap.querySelector(".pv-sigclear");
  const msg=wrap.querySelector(".pv-sigmsg");
  const ctx=canvas.getContext("2d");
  ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#13171e";
  if(hidden.value)loadSignatureImage(canvas,hidden.value);
  const locked=canvas.dataset.disabled==="1";
  let dirty=false;
  let uploading=false;

  const setMsg=(text,cls)=>{
    if(!msg)return;
    msg.className="pv-sigmsg"+(cls?` ${cls}`:"");
    msg.textContent=text||"";
  };
  const updateButtons=()=>{
    if(saveBtn)saveBtn.disabled=locked||uploading||!dirty;
    if(clearBtn)clearBtn.disabled=locked||uploading;
  };

  if(hidden.value)setMsg("Signature saved.","ok");
  updateButtons();

  let drawing=false,last=null;
  const pos=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};};
  const start=e=>{
    if(locked||uploading)return;
    e.preventDefault();
    drawing=true;
    last=pos(e);
  };
  const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;};
  const end=()=>{
    if(!drawing)return;drawing=false;
    dirty=true;
    hidden.value="";
    setMsg("Changes not saved yet. Click Save signature.","pending");
    updateButtons();
  };
  canvas.addEventListener("pointerdown",start);
  canvas.addEventListener("pointermove",move);
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);
  canvas.addEventListener("pointerleave",end);

  saveBtn?.addEventListener("click",async()=>{
    if(locked||uploading||!dirty)return;
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
    if(!blob){
      setMsg("Failed to read the signature.","error");
      return;
    }
    uploading=true;
    updateButtons();
    setMsg("Saving the signature to the server…","pending");
    try{
      const fd=new FormData();
      fd.append("file",blob,`signature-${Date.now()}.png`);
      fd.append("fieldType","signature");
      const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/uploads",{
        method:"POST",
        headers:pubHeaders({}),
        body:fd
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||"Failed to save the signature");
      hidden.value=String(d.url||"");
      dirty=false;
      hidden.dispatchEvent(new Event("change",{bubbles:true}));
      setMsg("Signature saved.","ok");
    }catch(e){
      if(OFFLINE_MODE&&isNetworkError(e)){
        try{
          const ref=await storeOfflineUpload(new File([blob],`signature-${Date.now()}.png`,{type:"image/png"}),"signature");
          hidden.value=ref;
          dirty=false;
          hidden.dispatchEvent(new Event("change",{bubbles:true}));
          updateOfflineBadge();
          setMsg("Signature saved on this device — it will be sent once you are back online.","ok");
          return;
        }catch(_e2){}
      }
      setMsg(e.message||"Failed to save the signature","error");
    }finally{
      uploading=false;
      updateButtons();
    }
  });

  clearBtn?.addEventListener("click",()=>{
    if(uploading)return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dirty=false;
    hidden.value="";
    hidden.dispatchEvent(new Event("change",{bubbles:true}));
    setMsg("","");
    updateButtons();
  });
}
function loadSignatureImage(canvas,src){
  const ctx=canvas.getContext("2d");
  const img=new Image();
  img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);};
  img.src=src;
}

function wireGeoButton(btn){
  if(btn._wired)return;btn._wired=true;
  btn.addEventListener("click",()=>{
    const wrap=btn.closest(".pv-field");
    const msg=wrap?.querySelector(".pv-geomsg");
    const input=btn.previousElementSibling;
    if(msg){msg.textContent="";msg.classList.remove("error");}
    if(!navigator.geolocation){if(msg){msg.textContent="Geolocation is not supported by this browser.";msg.classList.add("error");}return;}
    const orig=btn.textContent;btn.disabled=true;btn.textContent="Searching…";
    navigator.geolocation.getCurrentPosition(
      pos=>{
        btn.disabled=false;btn.textContent=orig;
        input.value=`${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        input.dispatchEvent(new Event("change",{bubbles:true}));
      },
      err=>{
        btn.disabled=false;btn.textContent=orig;
        if(msg){msg.textContent=err.code===1?"Izin lokasi ditolak.":"Failed to get location: "+err.message;msg.classList.add("error");}
      },
      {enableHighAccuracy:true,timeout:15000}
    );
  });
}

function wireScanButton(btn){
  if(btn._wired)return;btn._wired=true;
  if(!("BarcodeDetector" in window)){btn.disabled=true;btn.title="Automatic scanning is not supported by this browser — enter it manually.";return;}
  btn.addEventListener("click",()=>openBarcodeScanner(btn.previousElementSibling));
}
async function openBarcodeScanner(input){
  const bg=document.createElement("div");bg.className="pv-modal-bg";
  bg.innerHTML=`<div class="pv-modal pv-scanmodal">
    <h3>Pindai Barcode</h3>
    <p class="pv-modal-sub">Point the camera at the barcode or QR code.</p>
    <video id="scanVideo" autoplay playsinline muted></video>
    <div class="pv-modal-actions"><button class="btn ghost" id="scanCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(bg);
  const video=bg.querySelector("#scanVideo"),sub=bg.querySelector(".pv-modal-sub");
  let stream=null,stopped=false;
  const close=()=>{stopped=true;if(stream)stream.getTracks().forEach(t=>t.stop());bg.remove();};
  bg.querySelector("#scanCancel").addEventListener("click",close);
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject=stream;
    const detector=new BarcodeDetector();
    const loop=async()=>{
      if(stopped)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          input.value=codes[0].rawValue;
          input.dispatchEvent(new Event("change",{bubbles:true}));
          close();
          return;
        }
      }catch(_){}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }catch(e){
    if(sub)sub.textContent="Cannot access the camera: "+e.message;
  }
}

/* ---- foto / file upload ---- */
/* Defined in /image-compress.js; falls back to no compression if that script failed
   to load, so a photo field still works rather than throwing during render. */
function photoMaxKB(c){return window.ImageCompress?ImageCompress.maxKBFor(c):0;}
function wirePhotoField(wrap){
  if(wrap._wired)return;wrap._wired=true;
  const hidden=wrap.querySelector("input[type=hidden]");
  const fileInput=wrap.querySelector(".pv-photofile");
  const uploadBtn=wrap.querySelector(".pv-photoupload");
  const state=wrap.querySelector(".pv-photostate");
  const preview=wrap.querySelector(".pv-photopreview");
  if(!hidden||!fileInput||!uploadBtn||!state||!preview)return;
  const key=hidden.dataset.k;
  const fieldType=wrap.dataset.fieldType||"file";
  renderPhotoPreview(wrap);
  wrap._pickSeq=0;
  fileInput.addEventListener("change",async()=>{
    const f=fileInput.files[0];if(!f)return;
    clearPendingUpload(key);
    let use=f,note="";
    const maxKB=Number(wrap.dataset.maxKb||0);
    if(fieldType==="photo"&&maxKB>0&&window.ImageCompress){
      state.className="pv-photostate pending";
      state.textContent="Compressing the photo…";
      // Shrinking a large photo takes a moment; if the enumerator picks another
      // one meanwhile, the slower result must not overwrite the newer choice.
      const seq=++wrap._pickSeq;
      const res=await ImageCompress.compress(f,maxKB);
      if(seq!==wrap._pickSeq)return;
      use=res.file;
      if(res.changed){
        note=`Compressed ${fmtSize(res.originalSize)} → ${fmtSize(use.size)}.`;
        // Even the smallest setting can miss the budget on a very detailed photo.
        // It is still uploaded: refusing it would leave the enumerator standing in
        // the field with no way to record the answer.
        if(!res.reachedTarget)note+=` Still above the ${maxKB} KB limit.`;
      }
    }
    PENDING_UPLOADS[key]={
      file:use,
      fieldType,
      note,
      objectUrl:(fieldType==="photo"||String(use.type||"").startsWith("image/"))?URL.createObjectURL(use):""
    };
    renderPhotoPreview(wrap);
  });
  uploadBtn.addEventListener("click",async()=>{
    const pending=PENDING_UPLOADS[key];
    if(!pending||!pending.file)return;
    uploadBtn.disabled=true;
    fileInput.disabled=true;
    state.className="pv-photostate pending";
    state.textContent="Uploading the file…";
    try{
      const fd=new FormData();
      fd.append("file",pending.file);
      fd.append("fieldType",fieldType);
      const r=await fetch("/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/uploads",{
        method:"POST",
        headers:pubHeaders({}),
        body:fd
      });
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||"Failed to upload the file");
      hidden.value=d.url||"";
      fileInput.value="";
      fileInput.disabled=false;
      clearPendingUpload(key);
      hidden.dispatchEvent(new Event("change",{bubbles:true}));
    }catch(e){
      fileInput.disabled=false;
      // Offline the upload can never succeed, and refusing it would strand the whole
      // response: submit is blocked while a file is still pending. So the photo is
      // kept on the device and the answer points at it until it can be sent.
      if(OFFLINE_MODE&&isNetworkError(e)){
        try{
          const ref=await storeOfflineUpload(pending.file,fieldType);
          hidden.value=ref;
          fileInput.value="";
          clearPendingUpload(key);
          hidden.dispatchEvent(new Event("change",{bubbles:true}));
          updateOfflineBadge();
          renderPhotoPreview(wrap);
          return;
        }catch(_e2){}
      }
      renderPhotoPreview(wrap,e.message);
    }
  });
  preview.addEventListener("click",e=>{
    if(e.target.classList.contains("pv-photocancel")){
      clearPendingUpload(key);
      fileInput.value="";
      renderPhotoPreview(wrap);
      return;
    }
    if(!e.target.classList.contains("pv-photoclear"))return;
    clearPendingUpload(key);
    hidden.value="";fileInput.value="";
    preview.hidden=true;preview.innerHTML="";
    hidden.dispatchEvent(new Event("change",{bubbles:true}));
  });
}
/* Placeholder answers have no URL the browser can render, so the blob is pulled back
   out of IndexedDB and turned into an object URL. Kept in a map because
   renderPhotoPreview is synchronous and runs on every re-render. */
const LOCAL_PREVIEWS=Object.create(null);
function isLocalRef(v){return typeof v==="string"&&OQ&&v.startsWith(OQ.LOCAL_PREFIX);}
function loadLocalPreview(ref,onReady){
  if(LOCAL_PREVIEWS[ref]!==undefined)return LOCAL_PREVIEWS[ref];
  LOCAL_PREVIEWS[ref]=""; // claim the slot so a re-render does not queue a second read
  OQ.getFile(ref.slice(OQ.LOCAL_PREFIX.length)).then(rec=>{
    if(rec&&rec.blob){LOCAL_PREVIEWS[ref]=URL.createObjectURL(rec.blob);onReady&&onReady();}
  }).catch(()=>{});
  return "";
}
function renderPhotoPreview(wrap,errorMsg){
  const hidden=wrap.querySelector("input[type=hidden]");
  const fileInput=wrap.querySelector(".pv-photofile");
  const uploadBtn=wrap.querySelector(".pv-photoupload");
  const state=wrap.querySelector(".pv-photostate");
  const preview=wrap.querySelector(".pv-photopreview");
  if(!hidden||!fileInput||!uploadBtn||!state||!preview)return;
  const key=hidden.dataset.k;
  const fieldType=wrap.dataset.fieldType||"file";
  const pending=PENDING_UPLOADS[key];
  const disabled=fileInput.disabled;
  const savedValue=String(hidden.value||"");
  if(pending&&pending.file){
    const dis=disabled?" disabled":"";
    const media=pending.objectUrl?`<img class="pv-photoimg" src="${pending.objectUrl}">`:`<span style="font-size:12.5px;color:var(--ink-soft)">${esc(pending.file.name)}</span>`;
    preview.innerHTML=`${media}<button type="button" class="pv-smbtn pv-photocancel"${dis}>Cancel selection</button>`;
    preview.hidden=false;
    uploadBtn.disabled=disabled;
    state.className="pv-photostate pending";
    const picked=(pending.note?pending.note+" ":"")+"Press Upload to store it on the server.";
    state.textContent=errorMsg||picked;
    return;
  }
  uploadBtn.disabled=true;
  if(isLocalRef(savedValue)){
    const dis=disabled?" disabled":"";
    const src=loadLocalPreview(savedValue,()=>renderPhotoPreview(wrap));
    const media=src?`<img class="pv-photoimg" src="${src}">`:`<span style="font-size:12.5px;color:var(--ink-soft)">Attachment saved on this device</span>`;
    preview.innerHTML=`${media}<button type="button" class="pv-smbtn pv-photoclear"${dis}>Remove</button>`;
    preview.hidden=false;
    state.className="pv-photostate pending";
    state.textContent="Saved on this device — it will be uploaded once you are back online.";
    return;
  }
  if(savedValue){
    const dis=disabled?" disabled":"";
    const src=mediaSourceOf(savedValue)||savedValue;
    if(isImageMediaSource(fieldType,src)){
      preview.innerHTML=`<img class="pv-photoimg" src="${src}"><button type="button" class="pv-smbtn pv-photoclear"${dis}>Remove photo</button>`;
    }else{
      preview.innerHTML=`<a href="${esc(src)}" target="_blank" rel="noreferrer" style="font-size:12.5px;color:var(--accent)">Open file</a><button type="button" class="pv-smbtn pv-photoclear"${dis}>Remove</button>`;
    }
    preview.hidden=false;
    state.className="pv-photostate ok";
    state.textContent="File is ready to use.";
    return;
  }
  preview.hidden=true;
  preview.innerHTML="";
  state.className="pv-photostate";
  state.textContent=errorMsg||"";
}

/* ---- async options ---- */
function resolveOptions(){
  const snap=pending.splice(0);
  snap.forEach(async({c,rp,enabled})=>{
    rp=rp||"";const key=rp+c.name,ke=esc(key);
    const box=document.getElementById("opt-"+ke);if(!box)return;
    const dis=enabled===false?" disabled":"";

    // Dependency: the {dep} placeholder in the optionsApi URL + an explicit dataKey trigger (depKeys),
    // or a parent field (optionsFilterBy) for cascading from inline referenceData (optionsRef).
    const urlTpl=(c.optionsApi&&c.optionsApi.url)||"";
    const urlDeps=[...urlTpl.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]);
    const explicitDeps=((c.optionsApi&&c.optionsApi.depKeys)||"").split(",").map(s=>s.trim()).filter(Boolean);
    const refDeps=(c.optionsRef&&c.optionsFilterBy)?[c.optionsFilterBy.trim()]:[];
    const deps=[...new Set([...urlDeps,...explicitDeps,...refDeps])];

    // Re-render the right thing: a roster row or an ordinary page
    const rerender=()=>{saveAnswers();rosterView?renderRosterRow():renderCurrentPage();};

    // Attach a listener to the dependency field: look for the roster-prefixed element first,
    // falling back to the page field. When it changes, clear this answer and re-render.
    function wireDeps(){
      deps.forEach(dep=>{
        const el=document.querySelector(`[data-k="${CSS.escape(rp+dep)}"]`)
               ||document.querySelector(`[data-k="${CSS.escape(dep)}"]`);
        if(el&&!el._depWired){
          el._depWired=true;
          el.addEventListener("change",()=>{saveAnswers();answers[key]="";rerender();});
        }
      });
    }

    // Dependency value: look for the roster-prefixed one first, falling back to the page field
    const depVal=dep=>(rp?(answers[rp+dep]??answers[dep]):answers[dep]);
    const missing=deps.find(dep=>{const v=depVal(dep);return v==null||v==="";});
    if(missing){
      answers[key]="";
      box.innerHTML=`<select class="pv-in" disabled><option value="">— fill in the previous field first —</option></select>`;
      wireDeps();
      return;
    }

    wireDeps();
    const opts=await optionsFor(c,rp);
    const multi=(c.type==="checkbox"||c.type==="multiselect");
    const saved=answers[key];
    if(c.type==="select"){
      const cur=saved!=null?String(saved):"";
      box.innerHTML=`<select data-k="${ke}" class="pv-in"${dis}><option value="">— select —</option>${opts.map(o=>`<option value="${esc(o.value)}"${cur===String(o.value)?" selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
      if(enabled!==false)box.querySelector("select")?.addEventListener("change",e=>{const f=e.target.closest(".pv-field"),fkey=f?.dataset?.fieldkey,top0=fkey?f.getBoundingClientRect().top:null;saveAnswers();rerender();if(fkey&&top0!=null)requestAnimationFrame(()=>snapScroll(fkey,top0));});
    }else{
      const savedArr=Array.isArray(saved)?saved.map(String):(saved!=null?[String(saved)]:[]);
      box.innerHTML=opts.map(o=>{const chk=multi?savedArr.includes(String(o.value)):String(saved)===String(o.value);const attr=multi?`data-kc="${ke}"`:`name="r_${ke}" data-kr="${ke}"`;return`<label class="pv-opt"><input type="${multi?"checkbox":"radio"}" ${attr} value="${esc(o.value)}"${chk?" checked":""}${dis}> ${esc(o.label)}</label>`;}).join("")||`<span class="pv-loading">no options</span>`;
      if(enabled!==false)box.querySelectorAll("[data-kr],[data-kc]").forEach(el=>el.addEventListener("change",e=>{const f=e.target.closest(".pv-field"),fkey=f?.dataset?.fieldkey,top0=fkey?f.getBoundingClientRect().top:null;saveAnswers();rerender();if(fkey&&top0!=null)requestAnimationFrame(()=>snapScroll(fkey,top0));}));
    }
  });
}

/* ---- submit ---- */
function collectAll(){
  saveAnswers();
  const ans={};
  Object.entries(answers).forEach(([k,v])=>{if(Array.isArray(v)?v.length>0:(v!==""&&v!=null))ans[k]=v;});
  return ans;
}
async function submit(){
  const btn=document.getElementById("pvSubmit"),msg=document.getElementById("msg");
  if(!btn||!msg)return;
  msg.className="msg";
  if(!ensureNoPendingUploads())return;
  const ans=collectAll();
  if(!Object.keys(ans).length){msg.className="msg err";msg.textContent="No answers have been filled in yet.";return;}
  btn.disabled=true;btn.textContent="Submitting…";
  const headers=pubHeaders({"Content-Type":"application/json"});
  // Travels with the queued payload when offline, so a response sent days later still
  // names the instrument it was filled against rather than today's.
  const body={answers:ans,schemaVersionId:SCHEMA_VERSION_ID};
  if(EDITING_RESPONSE_ID)body.responseId=EDITING_RESPONSE_ID;
  const url="/api/public/forms/"+encodeURIComponent(SHARE_TOKEN)+"/responses";
  let r;
  try{
    r=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});
  }catch(e){
    if(OFFLINE_MODE&&isNetworkError(e)){
      await queueOfflineRequest(url,headers,JSON.stringify(body));
      clearDraft();EDITING_RESPONSE_ID=null;document.getElementById("draftNote")?.remove();
      msg.className="msg ok";
      msg.textContent="Saved on this device — it will be sent automatically once you are back online.";
      // Success (saved) — the button stays disabled so it cannot be submitted twice;
      // it is only re-enabled if the submission fails (see the catch below).
      btn.textContent=MULTI_RESPONSE?"Submit Response":((EXISTING_RESPONSE||EDITING_RESPONSE_ID)?"Update Response":"Submit Response");
      return;
    }
    msg.className="msg err";msg.textContent="No internet connection.";
    btn.disabled=false;btn.textContent=MULTI_RESPONSE?"Submit Response":((EXISTING_RESPONSE||EDITING_RESPONSE_ID)?"Update Response":"Submit Response");
    return;
  }
  try{
    const d=await r.json();
    if(r.status===401){msg.className="msg err";msg.textContent="Session expired. Please log in again.";btn.disabled=false;btn.textContent=(EXISTING_RESPONSE||EDITING_RESPONSE_ID)?"Update Response":"Submit Response";return;}
    if(!r.ok)throw new Error(d.error||"Failed to submit");
    const wasEditingCancelled=!!EDITING_RESPONSE_ID;
    clearDraft();
    EDITING_RESPONSE_ID=null;
    document.getElementById("draftNote")?.remove();
    if(MULTI_RESPONSE){
      // Multi-response: after submitting, show success and return to the list
      msg.className="msg ok";
      msg.textContent="Thank you! Your response has been submitted.";
      // Submitted successfully — the button stays disabled until the page moves to the
      // response list, so it cannot be double-clicked while the redirect is pending.
      btn.textContent="Submit Response";
      document.getElementById("pvBody")?.scrollTo({top:0,behavior:"smooth"});
      setTimeout(async()=>{
        const prevResps=await fetchMyResponses();
        renderMyResponsesList({title:txt(SCHEMA?.title)||"Form"},prevResps);
      },1800);
    }else{
      const isFirstSend=!EXISTING_RESPONSE&&!wasEditingCancelled;
      EXISTING_RESPONSE=d;
      renderCurrentPage();
      const msg2=document.getElementById("msg");
      if(msg2){
        msg2.className="msg ok";
        msg2.textContent=isFirstSend?"Response submitted successfully.":"Response updated successfully.";
      }
      document.getElementById("pvBody")?.scrollTo({top:0,behavior:"smooth"});
    }
  }catch(e){msg.className="msg err";msg.textContent=e.message;btn.disabled=false;btn.textContent=MULTI_RESPONSE?"Submit Response":((EXISTING_RESPONSE||EDITING_RESPONSE_ID)?"Update Response":"Submit Response");}
}

flushOfflineQueue().catch(()=>{});
fetchForm().catch(e=>showErr(e.message));
</script>
