<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eForm - Builder</title>
<link rel="stylesheet" href="/builder.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark">eForm<span> · Builder</span></div></div>
    <input id="instTitle" class="ttl" placeholder="Instrument title…" aria-label="Instrument title">
    <div id="health" class="health ok"><span class="dot"></span><span id="healthTxt">Valid</span></div>
    <div class="actions">
      <button class="btn ghost" id="btnImport">Import JSON</button>
      <button class="btn" id="btnPreview">Preview Form</button>
      <button class="btn ghost" id="btnExport">Export JSON</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <button class="btn primary" id="btnSave">Save</button>
      <div class="topbar-sep"></div>
      <div class="user-menu" id="userMenu">
        <button class="user-btn" id="userBtn">
          <span class="user-avatar" id="userAvatar">?</span>
          <span class="user-name" id="userName">…</span>
          <span class="user-role" id="userRole"></span>
          <span class="user-caret">▾</span>
        </button>
        <div class="user-dropdown" id="userDropdown" hidden>
          <div class="udd-info">
            <span class="udd-name" id="uddName"></span>
            <span class="udd-role" id="uddRole"></span>
          </div>
          <div class="udd-sep"></div>
          <div class="udd-lang">
            <span class="udd-lang-label">Language</span>
            <div class="udd-lang-seg">
              <button type="button" class="udd-lang-opt" data-lang-btn="id">ID</button>
              <button type="button" class="udd-lang-opt" data-lang-btn="en">EN</button>
            </div>
          </div>
          <div class="udd-sep"></div>
          <a class="udd-item" href="/admin">← Back to Admin</a>
          <button class="udd-item danger" id="btnLogout">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="cols" id="cols">
    <!-- SIDEBAR 1 — komponen/builder -->
    <aside class="sb" id="sb1">
      <div class="full">
        <div class="sb-head"><span class="t">Builder · Components</span><button class="collapse" id="col1" title="Close">‹</button></div>
        <div class="sb-body" id="palette"></div>
      </div>
      <div class="rail"><button class="collapse" id="exp1" title="Open">›</button><span class="rlabel">Components</span></div>
    </aside>

    <!-- SIDEBAR 2 — pages/form -->
    <aside class="sb" id="sb2">
      <div class="full">
        <div class="sb-head"><span class="t">Form · Pages</span><button class="collapse" id="col2" title="Close">‹</button></div>
        <div class="sb-body"><div id="pageList"></div><button class="addpage" id="addPage">+ Add page</button></div>
      </div>
      <div class="rail"><button class="collapse" id="exp2" title="Open">›</button><span class="rlabel">Page</span></div>
    </aside>

    <!-- CANVAS -->
    <main class="canvas">
      <div class="cv-head" id="cvHead"></div>
      <div class="stage" id="stage"></div>
    </main>

    <!-- INSPECTOR -->
    <aside class="inspector">
      <div class="tabs">
        <button class="tab on" data-tab="props">Properties</button>
        <button class="tab" data-tab="json">JSON &amp; Validation <span class="n" id="tabN" hidden></span></button>
      </div>
      <div class="pane" id="paneProps"></div>
      <div class="pane" id="paneJson" hidden></div>
    </aside>
  </div>
</div>

<div id="preview" class="pv" hidden>
  <div class="pv-bar">
    <button class="pv-side-tog" id="pvSideTog" title="Page list">☰</button>
    <span class="pv-title" id="pvTitle">Form</span>
    <span class="pv-badge">PREVIEW</span>
    <select class="pv-modesel" id="pvMode" title="Navigation mode">
      <option value="section">Per page</option>
      <option value="scroll">Scroll</option>
    </select>
    <button class="btn" id="pvClose" style="margin-left:auto">Close ✕</button>
  </div>
  <div id="pvSideBd" class="pv-side-bd"></div>
  <div class="pv-main">
    <aside class="pv-side" id="pvSide"></aside>
    <div class="pv-content">
      <div class="pv-body" id="pvBody"></div>
      <div id="pvNavArea" class="pv-nav-area"></div>
    </div>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/searchable-select.js"></script>
<script src="/builder.js"></script>
<script src="/builder-bridge.js"></script>
<span id="ebb-toast" class="ebb-toast"></span>
</body>
</html>
